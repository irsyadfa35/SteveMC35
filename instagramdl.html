<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram Downloader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 24px;
        }
        .container {
            width: 100%;
            max-width: 820px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 30px;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .menu-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.6);
            font-size: 22px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        .menu-toggle:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.15);
        }
        .menu-toggle:active {
            transform: scale(0.92);
        }
        .header-content {
            flex: 1;
            text-align: center;
        }
        .header-content h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-content p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            margin-top: 4px;
        }

        /* Menu Overlay & Panel (import dari menu.html) */
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .menu-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        #menuContainer .menu-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100%;
            background: rgba(20, 20, 35, 0.98);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 4px 0 40px rgba(0, 0, 0, 0.6);
            z-index: 1000;
            transform: translateX(-100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 28px 20px;
            display: flex;
            flex-direction: column;
        }
        #menuContainer .menu-panel.open {
            transform: translateX(0);
        }

        #menuContainer .menu-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 24px;
        }
        #menuContainer .menu-header .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #ff0050, #ff6b8a);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
        }
        #menuContainer .menu-header .brand-text {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }
        #menuContainer .menu-header .brand-text span {
            color: rgba(255, 255, 255, 0.4);
            font-weight: 400;
        }

        #menuContainer .menu-list {
            list-style: none;
            flex: 1;
        }
        #menuContainer .menu-list li {
            margin-bottom: 4px;
        }
        #menuContainer .menu-list li a {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 16px;
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s;
        }
        #menuContainer .menu-list li a:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }
        #menuContainer .menu-list li a i {
            width: 24px;
            font-size: 18px;
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
        }
        #menuContainer .menu-list li a.active {
            background: rgba(255, 0, 80, 0.12);
            color: #ff6b8a;
        }
        #menuContainer .menu-list li a.active i {
            color: #ff6b8a;
        }
        #menuContainer .menu-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 20px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.25);
            text-align: center;
        }

        /* Input */
        .input-section {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 30px;
        }
        .input-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .input-wrapper input {
            flex: 1;
            min-width: 180px;
            padding: 16px 20px;
            border-radius: 16px;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }
        .input-wrapper input:focus {
            border-color: #e6683c;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(230, 104, 60, 0.15);
        }
        .btn-paste {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 16px;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.5);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-paste:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        .btn-paste.pasted {
            color: #00e676;
            border-color: #00e676;
            background: rgba(0, 230, 118, 0.1);
        }
        .btn-convert {
            padding: 16px 32px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, #f09433, #e6683c, #dc2743);
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(220, 39, 67, 0.3);
        }
        .btn-convert:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(220, 39, 67, 0.45);
        }
        .btn-convert:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-convert .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        .btn-convert.loading .spinner {
            display: block;
        }
        .btn-convert.loading .btn-text,
        .btn-convert.loading .btn-icon {
            display: none;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-msg {
            display: none;
            margin-top: 12px;
            padding: 14px 18px;
            background: rgba(255, 0, 80, 0.12);
            border-left: 4px solid #dc2743;
            border-radius: 12px;
            color: #ff6b8a;
            font-size: 14px;
            align-items: center;
            gap: 10px;
        }
        .error-msg.show {
            display: flex;
        }

        /* Result */
        .result-section {
            display: none;
            margin-top: 20px;
            animation: fadeUp 0.5s ease;
        }
        .result-section.show {
            display: block;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 20px 24px 24px;
        }

        /* Video Player */
        .video-wrapper {
            position: relative;
            background: #000;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Gallery Slider (mirip TikTok) */
        .gallery-container {
            position: relative;
            background: #111;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        .gallery-slider {
            display: flex;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            height: 100%;
            width: 100%;
        }
        .gallery-slider img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            flex-shrink: 0;
            background: #0a0a0a;
        }
        .gallery-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border: none;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gallery-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .gallery-btn.prev {
            left: 12px;
        }
        .gallery-btn.next {
            right: 12px;
        }
        .gallery-dots {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .gallery-dots span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s;
        }
        .gallery-dots span.active {
            background: #e6683c;
            width: 28px;
            border-radius: 6px;
            box-shadow: 0 0 12px rgba(230, 104, 60, 0.5);
        }
        .gallery-counter {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: #fff;
            z-index: 10;
        }

        /* Download Buttons */
        .download-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }
        .btn-download {
            flex: 1;
            min-width: 120px;
            padding: 12px 18px;
            border-radius: 14px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: inherit;
        }
        .btn-download.video {
            background: linear-gradient(135deg, #f09433, #e6683c);
            color: #fff;
            box-shadow: 0 4px 20px rgba(230, 104, 60, 0.3);
        }
        .btn-download.video:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(230, 104, 60, 0.45);
        }
        .btn-download.secondary {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.7);
        }
        .btn-download.secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }
        .btn-download:active:not(:disabled) {
            transform: scale(0.97);
        }
        .btn-download .spinner-small {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        .btn-download.loading .spinner-small {
            display: block;
        }
        .btn-download.loading .btn-text,
        .btn-download.loading .btn-icon {
            display: none;
        }

        .btn-download-all {
            background: linear-gradient(135deg, #dc2743, #cc2366);
            color: #fff;
            box-shadow: 0 4px 20px rgba(220, 39, 67, 0.3);
        }
        .btn-download-all:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(220, 39, 67, 0.45);
        }
        .btn-download-per-image {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-download-per-image:hover {
            background: rgba(255, 255, 255, 0.16);
        }

        .gallery-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            justify-content: space-between;
            align-items: center;
        }
        .gallery-toolbar .left {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .gallery-toolbar .right {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            text-align: center;
            color: rgba(255, 255, 255, 0.25);
        }
        .empty-state i {
            font-size: 56px;
            margin-bottom: 16px;
            color: rgba(255, 255, 255, 0.08);
        }

        @media (max-width: 640px) {
            .container {
                padding: 0 4px;
            }
            .header-content h1 {
                font-size: 20px;
            }
            .result-card {
                padding: 16px;
            }
            .download-row {
                flex-direction: column;
            }
            .gallery-toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .gallery-toolbar .left,
            .gallery-toolbar .right {
                justify-content: center;
            }
            #menuContainer .menu-panel {
                width: 260px;
            }
            .menu-toggle {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
        }
        @media (max-width: 420px) {
            #menuContainer .menu-panel {
                width: 240px;
                padding: 20px 16px;
            }
            .menu-toggle {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- Container menu (diisi dari menu.html) -->
    <div id="menuContainer"></div>

    <div class="container">

        <!-- Header -->
        <div class="header">
            <button class="menu-toggle" id="menuToggle" title="Buka menu">
                <i class="fas fa-bars"></i>
            </button>
            <div class="header-content">
                <h1><i class="fab fa-instagram"></i> Instagram Downloader</h1>
                <p>Video (Reels/Stories) & Gambar (Postingan)</p>
            </div>
        </div>

        <!-- Input -->
        <div class="input-section">
            <div class="input-wrapper">
                <input type="url" id="urlInput" placeholder="Tempel link Instagram..." autocomplete="off" />
                <button class="btn-paste" id="pasteBtn" title="Tempel"><i class="fas fa-paste"></i></button>
                <button class="btn-convert" id="convertBtn">
                    <span class="btn-icon"><i class="fas fa-arrow-right"></i></span>
                    <span class="btn-text">Convert</span>
                    <span class="spinner"></span>
                </button>
            </div>
            <div class="error-msg" id="errorMsg"><i class="fas fa-exclamation-circle"></i><span id="errorText"></span></div>
        </div>

        <!-- Result -->
        <div class="result-section" id="resultSection">
            <div class="result-card" id="resultCard"></div>
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState">
            <i class="fab fa-instagram"></i>
            <p>Masukkan link Instagram, lalu klik <strong>Convert</strong>.</p>
        </div>

    </div>

    <script>
        // ─── Load menu dari menu.html + active link otomatis ───
        const menuContainer = document.getElementById('menuContainer');
        const menuToggle = document.getElementById('menuToggle');
        const menuOverlay = document.getElementById('menuOverlay');

        fetch('menu.html')
            .then(res => {
                if (!res.ok) throw new Error('Menu tidak ditemukan');
                return res.text();
            })
            .then(html => {
                menuContainer.innerHTML = html;
                const menuPanel = document.getElementById('menuPanel');
                if (!menuPanel) return;

                const currentPage = window.location.pathname.split('/').pop() || 'index.html';
                const allLinks = menuPanel.querySelectorAll('.menu-list a');
                allLinks.forEach(link => {
                    const href = link.getAttribute('href');
                    link.classList.remove('active');
                    if (href === currentPage) {
                        link.classList.add('active');
                    } else if (href.endsWith('/') && currentPage.startsWith(href.replace('/', ''))) {
                        link.classList.add('active');
                    }
                });

                function toggleMenu(forceState) {
                    const isOpen = typeof forceState === 'boolean' ? forceState : !menuPanel.classList.contains('open');
                    menuPanel.classList.toggle('open', isOpen);
                    menuOverlay.classList.toggle('open', isOpen);
                    document.body.style.overflow = isOpen ? 'hidden' : '';
                }

                function closeMenu() { toggleMenu(false); }

                menuToggle.addEventListener('click', () => toggleMenu());
                menuOverlay.addEventListener('click', closeMenu);

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && menuPanel.classList.contains('open')) closeMenu();
                });

                menuPanel.querySelectorAll('.menu-list a').forEach(link => {
                    link.addEventListener('click', () => {
                        if (link.getAttribute('href') !== '#') closeMenu();
                    });
                });
            })
            .catch(err => {
                console.warn('Gagal memuat menu:', err);
                menuContainer.innerHTML = '<p style="color:rgba(255,255,255,0.3);padding:12px;">Menu tidak tersedia</p>';
            });

        // ─── DOM refs ──────────────────────────────────────────
        const urlInput = document.getElementById('urlInput');
        const convertBtn = document.getElementById('convertBtn');
        const pasteBtn = document.getElementById('pasteBtn');
        const errorMsg = document.getElementById('errorMsg');
        const errorText = document.getElementById('errorText');
        const resultSection = document.getElementById('resultSection');
        const resultCard = document.getElementById('resultCard');
        const emptyState = document.getElementById('emptyState');

        // ─── Helpers ──────────────────────────────────────────
        function showError(msg) {
            errorText.textContent = msg || 'Terjadi kesalahan.';
            errorMsg.classList.add('show');
        }

        function hideError() {
            errorMsg.classList.remove('show');
        }

        function setLoading(isLoading) {
            convertBtn.disabled = isLoading;
            urlInput.disabled = isLoading;
            pasteBtn.disabled = isLoading;
            convertBtn.classList.toggle('loading', isLoading);
        }

        // ─── Fetch API ─────────────────────────────────────────
        async function fetchInstagram(url) {
            const encoded = encodeURIComponent(url.trim());
            const apiUrl = `https://api.nexray.eu.cc/downloader/instagram?url=${encoded}`;
            const resp = await fetch(apiUrl);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            if (!data.status) throw new Error(data.message || 'API error');
            if (!data.result || !Array.isArray(data.result) || data.result.length === 0) {
                throw new Error('Tidak ada konten yang ditemukan.');
            }
            return data;
        }

        // ─── Download file ─────────────────────────────────────
        async function downloadFile(url, filename, buttonElement, silent = false) {
            if (!url) return;
            try {
                if (buttonElement) {
                    buttonElement.disabled = true;
                    const orig = buttonElement.innerHTML;
                    buttonElement.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                    setTimeout(() => {
                        if (buttonElement) {
                            buttonElement.innerHTML = orig;
                            buttonElement.disabled = false;
                        }
                    }, 3000);
                }
                const resp = await fetch(url);
                if (!resp.ok) throw new Error('Gagal');
                const blob = await resp.blob();
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(link.href), 5000);
            } catch (e) {
                try {
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = filename;
                    link.target = '_blank';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                } catch (_) {
                    if (!silent) showError('Gagal mengunduh. Coba klik kanan dan "Save link as..."');
                }
            }
            if (buttonElement) {
                buttonElement.disabled = false;
            }
        }

        // ─── Copy to clipboard ─────────────────────────────────
        function copyToClipboard(text, btn) {
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                const orig = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> Tersalin!';
                setTimeout(() => btn.innerHTML = orig, 2000);
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                const orig = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> Tersalin!';
                setTimeout(() => btn.innerHTML = orig, 2000);
            });
        }

        // ─── Paste ─────────────────────────────────────────────
        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    urlInput.value = text;
                    urlInput.focus();
                    pasteBtn.classList.add('pasted');
                    setTimeout(() => pasteBtn.classList.remove('pasted'), 1500);
                } else showError('Clipboard kosong.');
            } catch (_) {
                const text = prompt('Tidak dapat akses clipboard. Tempel manual:');
                if (text !== null && text.trim() !== '') {
                    urlInput.value = text.trim();
                    urlInput.focus();
                }
            }
        }

        // ─── Render Video ──────────────────────────────────────
        function renderVideo(item) {
            const videoUrl = item.url || '';
            const thumb = item.thumbnail || '';
            const html = `
                <div class="video-wrapper">
                    <video id="videoPlayer" controls preload="metadata" playsinline poster="${thumb}">
                        <source src="${videoUrl}" type="video/mp4" />
                    </video>
                </div>
                <div class="download-row">
                    <button class="btn-download video" id="dlVideoBtn"><i class="fas fa-download"></i> Download Video</button>
                    <button class="btn-download secondary" id="copyLinkBtn"><i class="fas fa-copy"></i> Salin Link</button>
                </div>
            `;
            resultCard.innerHTML = html;

            document.getElementById('dlVideoBtn').addEventListener('click', () => {
                if (videoUrl) downloadFile(videoUrl, 'instagram_video.mp4', document.getElementById('dlVideoBtn'));
            });
            document.getElementById('copyLinkBtn').addEventListener('click', () => {
                copyToClipboard(videoUrl, document.getElementById('copyLinkBtn'));
            });
        }

        // ─── Render Gallery (images) ───────────────────────────
        function renderGallery(items) {
            const images = items.map(item => item.url).filter(Boolean);
            if (images.length === 0) {
                resultCard.innerHTML = '<p style="color:rgba(255,255,255,0.5);">Tidak ada gambar yang ditemukan.</p>';
                return;
            }

            let slidesHtml = images.map((img, i) =>
                `<img src="${img}" alt="Gambar ${i+1}" loading="lazy" />`
            ).join('');

            let html = `
                <div class="gallery-container" id="galleryContainer">
                    <div class="gallery-slider" id="gallerySlider">${slidesHtml}</div>
                    <button class="gallery-btn prev" id="galleryPrev"><i class="fas fa-chevron-left"></i></button>
                    <button class="gallery-btn next" id="galleryNext"><i class="fas fa-chevron-right"></i></button>
                    <div class="gallery-dots" id="galleryDots"></div>
                    <div class="gallery-counter" id="galleryCounter">1 / ${images.length}</div>
                </div>
                <div class="download-row">
                    <button class="btn-download secondary" id="copyLinkBtnGallery"><i class="fas fa-copy"></i> Salin Link</button>
                </div>
                <div class="gallery-toolbar">
                    <div class="left">
                        <span style="font-size:13px;color:rgba(255,255,255,0.4);"><i class="fas fa-images"></i> ${images.length} gambar</span>
                        <button class="btn-download-all btn-download" id="dlAllImagesBtn"><i class="fas fa-download"></i> Download Semua</button>
                    </div>
                    <div class="right" id="perImageButtons"></div>
                </div>
            `;
            resultCard.innerHTML = html;

            // ─── Slider logic ──────────────────────────────────
            const slider = document.getElementById('gallerySlider');
            const prevBtn = document.getElementById('galleryPrev');
            const nextBtn = document.getElementById('galleryNext');
            const dotsContainer = document.getElementById('galleryDots');
            const counter = document.getElementById('galleryCounter');
            const total = images.length;
            let current = 0;

            for (let i = 0; i < total; i++) {
                const dot = document.createElement('span');
                if (i === 0) dot.classList.add('active');
                dot.dataset.index = i;
                dot.addEventListener('click', () => goTo(i));
                dotsContainer.appendChild(dot);
            }
            const dots = dotsContainer.querySelectorAll('span');

            function goTo(index) {
                if (index < 0) index = total - 1;
                if (index >= total) index = 0;
                current = index;
                slider.style.transform = `translateX(-${current * 100}%)`;
                dots.forEach((d, i) => d.classList.toggle('active', i === current));
                counter.textContent = `${current+1} / ${total}`;
            }

            prevBtn.addEventListener('click', () => goTo(current - 1));
            nextBtn.addEventListener('click', () => goTo(current + 1));

            let touchStartX = 0,
                touchEndX = 0;
            const container = document.getElementById('galleryContainer');
            container.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
            container.addEventListener('touchend', e => {
                touchEndX = e.changedTouches[0].screenX;
                const diff = touchStartX - touchEndX;
                if (Math.abs(diff) > 40) {
                    if (diff > 0) goTo(current + 1);
                    else goTo(current - 1);
                }
            }, { passive: true });

            // ─── Download per image ──────────────────────────
            const perImageContainer = document.getElementById('perImageButtons');
            images.forEach((imgUrl, idx) => {
                const btn = document.createElement('button');
                btn.className = 'btn-download-per-image';
                btn.innerHTML = `<i class="fas fa-download"></i> ${idx+1}`;
                btn.addEventListener('click', () => {
                    downloadFile(imgUrl, `instagram_${idx+1}.jpg`, btn);
                });
                perImageContainer.appendChild(btn);
            });

            // ─── Download all images ─────────────────────────
            document.getElementById('dlAllImagesBtn').addEventListener('click', async () => {
                const btn = document.getElementById('dlAllImagesBtn');
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengunduh...';
                try {
                    for (let i = 0; i < images.length; i++) {
                        await downloadFile(images[i], `instagram_${i+1}.jpg`, null, true);
                        await new Promise(r => setTimeout(r, 300));
                    }
                } catch (e) { console.warn(e); }
                btn.innerHTML = '<i class="fas fa-download"></i> Download Semua';
                btn.disabled = false;
            });

            // ─── Copy link ──────────────────────────────────
            document.getElementById('copyLinkBtnGallery').addEventListener('click', () => {
                const link = images[0] || '';
                copyToClipboard(link, document.getElementById('copyLinkBtnGallery'));
            });
        }

        // ─── Main Convert ──────────────────────────────────────
        async function handleConvert() {
            const raw = urlInput.value.trim();
            if (!raw) { showError('Masukkan link Instagram.'); return; }
            if (!raw.includes('instagram.com')) { showError('Link tidak valid.'); return; }

            hideError();
            setLoading(true);
            resultSection.classList.remove('show');
            emptyState.style.display = 'flex';
            resultCard.innerHTML = '';

            try {
                const data = await fetchInstagram(raw);
                const items = data.result;

                // Tentukan tipe: jika semua item type === 'image' => gallery, else video
                const allImages = items.every(item => item.type === 'image');

                if (allImages && items.length > 1) {
                    renderGallery(items);
                } else {
                    // Ambil item pertama (biasanya video) atau jika campuran, tampilkan video pertama
                    const firstItem = items[0];
                    if (firstItem.type === 'video') {
                        renderVideo(firstItem);
                    } else if (firstItem.type === 'image' && items.length === 1) {
                        // single image, tampilkan sebagai gallery juga (dengan 1 gambar)
                        renderGallery(items);
                    } else {
                        // fallback: coba tampilkan semua sebagai gallery jika ada gambar
                        const imageItems = items.filter(item => item.type === 'image');
                        if (imageItems.length > 0) {
                            renderGallery(imageItems);
                        } else {
                            throw new Error('Konten tidak dikenali.');
                        }
                    }
                }

                resultSection.classList.add('show');
                emptyState.style.display = 'none';
                hideError();
            } catch (err) {
                console.error(err);
                showError(err.message || 'Gagal mengambil data.');
                resultSection.classList.remove('show');
                emptyState.style.display = 'flex';
            } finally {
                setLoading(false);
            }
        }

        // ─── Event listeners ──────────────────────────────────
        convertBtn.addEventListener('click', handleConvert);
        urlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault();
                handleConvert(); }
        });
        pasteBtn.addEventListener('click', pasteFromClipboard);

        // ─── Init ─────────────────────────────────────────────
        emptyState.style.display = 'flex';
        resultSection.classList.remove('show');
        hideError();
    </script>

</body>
</html>
