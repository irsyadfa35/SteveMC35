<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="theme-color" content="#0a0f23" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SteveMC</title>

  <!-- Font Awesome (untuk ikon menu) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Font Digital-7 dari CDN -->
  <link href="https://fonts.cdnfonts.com/css/digital-7" rel="stylesheet" />

  <style>
    /* ── Reset & Base ── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0f23;
      color: #cce0ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      transition: margin-left 0.3s;
      padding: 0 20px;
    }

    /* ── Tombol Hamburger (seperti contoh kedua) ── */
    .hamburger {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 1001;
      display: flex;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: background 0.3s;
    }
    .hamburger:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .hamburger span {
      display: block;
      width: 28px;
      height: 3px;
      background: #fff;
      border-radius: 4px;
      transition: all 0.3s;
      transform-origin: center;
    }
    .hamburger.active span:nth-child(1) {
      transform: rotate(45deg) translate(6px, 6px);
    }
    .hamburger.active span:nth-child(2) {
      opacity: 0;
    }
    .hamburger.active span:nth-child(3) {
      transform: rotate(-45deg) translate(6px, -6px);
    }

    /* ── Menu Overlay ── */
    .menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .menu-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    /* ── Menu Panel ── */
    .menu-panel {
      position: fixed;
      top: 0;
      left: 0;
      width: 280px;
      height: 100%;
      background: rgba(20, 20, 35, 0.98);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 4px 0 40px rgba(0, 0, 0, 0.6);
      z-index: 1000;
      transform: translateX(-100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
    }
    .menu-panel.open {
      transform: translateX(0);
    }

    .menu-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 24px;
    }
    .menu-header .brand-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #ff0050, #ff6b8a);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #fff;
    }
    .menu-header .brand-text {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
    }
    .menu-header .brand-text span {
      color: rgba(255, 255, 255, 0.4);
      font-weight: 400;
    }

    .menu-list {
      list-style: none;
      flex: 1;
    }
    .menu-list li {
      margin-bottom: 4px;
    }
    .menu-list li a {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 16px;
      border-radius: 12px;
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .menu-list li a:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
    }
    .menu-list li a i {
      width: 24px;
      font-size: 18px;
      text-align: center;
      color: rgba(255, 255, 255, 0.4);
    }
    .menu-list li a.active {
      background: rgba(255, 0, 80, 0.12);
      color: #ff6b8a;
    }
    .menu-list li a.active i {
      color: #ff6b8a;
    }

    .menu-footer {
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 20px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.25);
      text-align: center;
    }

    /* ── Header Image ── */
    .header-image {
      width: 100%;
      max-width: 1024px;
      margin: 100px auto 30px auto;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .header-image img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* ── Container ── */
    .container {
      text-align: center;
      width: 100%;
      max-width: 820px;
      padding: 0 10px;
    }

    .site-title {
      font-size: 2.8rem;
      font-weight: 700;
      color: #aa88ff;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }
    .divider {
      width: 60px;
      height: 3px;
      background: #8a6cff;
      margin: 6px auto 16px auto;
      border-radius: 4px;
    }
    .development-note {
      font-size: 1.2rem;
      color: #aa88ff;
      margin-bottom: 10px;
    }
    .greeting {
      font-size: 2rem;
      font-weight: 500;
      margin-bottom: 6px;
    }
    .typing {
      font-size: 1.5rem;
      font-weight: 300;
      color: #cce0ff;
      min-height: 2.2rem;
    }

    /* ── Kotak Jam Digital ── */
    .clock-box {
      display: flex;
      justify-content: center;
      margin: 30px auto 0 auto;
    }
    .clock-card {
      width: 340px;
      background: rgba(20, 20, 50, 0.7);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 18px;
      padding: 18px 16px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .clock-icon svg {
      width: 28px;
      height: 28px;
      stroke: #aa88ff;
      stroke-width: 2;
      fill: none;
    }

    /* ── JAM dengan font Digital-7 ── */
    #clockTime {
      font-family: 'Digital-7', 'Courier New', monospace;
      font-size: 2.6rem;
      font-weight: 400;
      color: #00f0ff;
      text-shadow: 0 0 20px #00f0ff66, 0 0 60px #00f0ff33;
      letter-spacing: 4px;
      line-height: 1.2;
    }
    #clockDate {
      font-size: 0.95rem;
      color: #88b0ff;
      letter-spacing: 1px;
      margin-top: 2px;
      font-family: 'Segoe UI', sans-serif;
    }

    /* ── Footer ── */
    .footer {
      text-align: center;
      color: #aaa;
      margin-top: 40px;
      padding-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 100%;
    }
    .footer-main {
      font-size: 0.9rem;
    }
    .footer-sub {
      font-size: 0.8rem;
      opacity: 0.7;
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .header-image {
        margin-top: 80px;
        border-radius: 14px;
      }
      .site-title {
        font-size: 2.2rem;
      }
      .greeting {
        font-size: 1.6rem;
      }
      .typing {
        font-size: 1.2rem;
      }
      .clock-card {
        width: 280px;
        padding: 14px 12px;
      }
      #clockTime {
        font-size: 2.2rem;
        letter-spacing: 3px;
      }
      .menu-panel {
        width: 260px;
      }
      .hamburger {
        top: 16px;
        left: 16px;
        padding: 8px 10px;
      }
      .hamburger span {
        width: 24px;
        height: 2.5px;
      }
    }

    @media (max-width: 420px) {
      .header-image {
        margin-top: 70px;
      }
      .site-title {
        font-size: 1.8rem;
      }
      .greeting {
        font-size: 1.3rem;
      }
      .typing {
        font-size: 1rem;
      }
      .clock-card {
        width: 250px;
        padding: 12px 10px;
      }
      #clockTime {
        font-size: 1.8rem;
      }
      #clockDate {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

  <!-- ─── TOMBOL HAMBURGER ─── -->
  <div class="hamburger" id="hamburgerBtn" aria-label="Buka menu">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <!-- ─── MENU OVERLAY ─── -->
  <div class="menu-overlay" id="menuOverlay"></div>

  <!-- ─── MENU PANEL ─── -->
  <nav class="menu-panel" id="menuPanel">
    <div class="menu-header">
      <div class="brand-icon"><i class="fas fa-download"></i></div>
      <div class="brand-text">Media<span>Download</span></div>
    </div>
    <ul class="menu-list">
      <li>
        <a href="index.html" class="active">
          <i class="fas fa-home"></i> Beranda
        </a>
      </li>
      <li>
        <a href="tiktokdl.html">
          <i class="fab fa-tiktok"></i> TikTok Download
        </a>
        <a href="youtube.html">
          <i class="fab fa-youtube"></i> Youtube MP3
        </a>
      </li>
    </ul>
    <div class="menu-footer">
      <i class="fas fa-code"></i> v1.0 &bull; by SteveMC
    </div>
  </nav>

  <!-- ─── HEADER IMAGE ─── -->
  <div class="header-image">
    <img src="https://c.termai.cc/i183/m5ecz.jpg" alt="SteveMC Banner" loading="lazy" />
  </div>

  <!-- ─── KONTEN UTAMA ─── -->
  <div class="container">
    <div class="site-title">SteveMC</div>
    <div class="divider"></div>
    <div class="development-note">Website ini masih dalam tahap pengembangan</div>
    <div class="greeting" id="greeting"></div>
    <div class="typing" id="typing"></div>

    <!-- Kotak Jam Digital dengan font Digital-7 -->
    <div class="clock-box">
      <div class="clock-card">
        <div class="clock-icon">
          <svg viewBox="0 0 24 24"><path d="M12 7V12L14.5 10.5M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div id="clockTime">00:00:00 WIB</div>
        <div id="clockDate">---</div>
      </div>
    </div>
  </div>

  <!-- ─── FOOTER ─── -->
  <footer class="footer">
    <div class="footer-main">©2025 SteveMC Developer</div>
    <div class="footer-sub">Since 15 Desember 2025</div>
  </footer>

  <script>
    // ─────────────────────────────────────────────
    //  MENU TOGGLE
    // ─────────────────────────────────────────────
    const hamburger = document.getElementById('hamburgerBtn');
    const menuPanel = document.getElementById('menuPanel');
    const menuOverlay = document.getElementById('menuOverlay');

    function toggleMenu(forceState) {
      const isOpen = typeof forceState === 'boolean' ? forceState : !menuPanel.classList.contains('open');
      menuPanel.classList.toggle('open', isOpen);
      menuOverlay.classList.toggle('open', isOpen);
      hamburger.classList.toggle('active', isOpen);
      document.body.style.overflow = isOpen ? 'hidden' : '';
    }

    hamburger.addEventListener('click', () => toggleMenu());
    menuOverlay.addEventListener('click', () => toggleMenu(false));

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && menuPanel.classList.contains('open')) {
        toggleMenu(false);
      }
    });

    document.querySelectorAll('.menu-list a').forEach(link => {
      link.addEventListener('click', () => {
        if (link.getAttribute('href') !== '#') {
          toggleMenu(false);
        }
      });
    });

    // ─────────────────────────────────────────────
    //  GREETING & TYPING EFFECT
    // ─────────────────────────────────────────────
    const greetingEl = document.getElementById('greeting');
    const hour = new Date().getHours();
    let greetingText = 'Selamat pagi';
    if (hour >= 12 && hour < 15) greetingText = 'Selamat siang';
    else if (hour >= 15 && hour < 18) greetingText = 'Selamat sore';
    else if (hour >= 18 || hour < 4) greetingText = 'Selamat malam';
    greetingEl.textContent = greetingText;

    const typingEl = document.getElementById('typing');
    const text = 'Welcome to website SteveMC';
    let index = 0;
    function type() {
      if (index < text.length) {
        typingEl.textContent += text.charAt(index);
        index++;
        setTimeout(type, 120);
      }
    }
    type();

    // ─────────────────────────────────────────────
    //  JAM DIGITAL (font Digital-7)
    // ─────────────────────────────────────────────
    function updateClock() {
      const now = new Date();
      const jam = String(now.getHours()).padStart(2, '0');
      const menit = String(now.getMinutes()).padStart(2, '0');
      const detik = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clockTime').textContent = `${jam}:${menit}:${detik} WIB`;

      const tanggal = now.toLocaleDateString('id-ID', {
        weekday: 'short',
        day: 'numeric',
        month: 'short',
        year: 'numeric'
      });
      document.getElementById('clockDate').textContent = tanggal;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>

</body>
</html>
