<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="theme-color" content="#0a0f23" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SteveMC</title>

  <!-- Font Awesome (untuk ikon menu) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    /* ── Reset & Base ── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0f23;
      color: #cce0ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 0 20px;
    }

    /* ── Tombol Hamburger (tanpa efek silang) ── */
    .hamburger {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 1001;
      display: flex;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: background 0.3s;
    }
    .hamburger:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .hamburger span {
      display: block;
      width: 28px;
      height: 3px;
      background: #fff;
      border-radius: 4px;
      transition: none; /* tidak ada transisi agar tidak berubah */
    }

    /* ── Menu Overlay ── */
    .menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .menu-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    /* ── Menu Panel (di-import dari menu.html) ── */
    #menuContainer .menu-panel {
      position: fixed;
      top: 0;
      left: 0;
      width: 280px;
      height: 100%;
      background: rgba(20, 20, 35, 0.98);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 4px 0 40px rgba(0, 0, 0, 0.6);
      z-index: 1000;
      transform: translateX(-100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
    }
    #menuContainer .menu-panel.open {
      transform: translateX(0);
    }

    #menuContainer .menu-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 24px;
    }
    #menuContainer .menu-header .brand-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #ff0050, #ff6b8a);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #fff;
    }
    #menuContainer .menu-header .brand-text {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
    }
    #menuContainer .menu-header .brand-text span {
      color: rgba(255, 255, 255, 0.4);
      font-weight: 400;
    }

    #menuContainer .menu-list {
      list-style: none;
      flex: 1;
    }
    #menuContainer .menu-list li {
      margin-bottom: 4px;
    }
    #menuContainer .menu-list li a {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 16px;
      border-radius: 12px;
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    #menuContainer .menu-list li a:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
    }
    #menuContainer .menu-list li a i {
      width: 24px;
      font-size: 18px;
      text-align: center;
      color: rgba(255, 255, 255, 0.4);
    }
    #menuContainer .menu-list li a.active {
      background: rgba(255, 0, 80, 0.12);
      color: #ff6b8a;
    }
    #menuContainer .menu-list li a.active i {
      color: #ff6b8a;
    }

    #menuContainer .menu-footer {
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 20px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.25);
      text-align: center;
    }

    /* ── Header Image dengan Border Lighting ── */
    .header-image {
      position: relative;
      width: 100%;
      max-width: 1024px;
      margin: 100px auto 30px auto;
      border-radius: 24px;
      overflow: hidden;
      filter: drop-shadow(0 0 25px rgba(0, 255, 255, 0.25));
    }

    .header-image::before {
      content: "";
      position: absolute;
      width: 250%;
      height: 250%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: conic-gradient(
        transparent 0deg,
        transparent 310deg,
        #00e5ff 325deg,
        #00ff88 340deg,
        #7c4dff 355deg,
        transparent 360deg
      );
      animation: spin 3s linear infinite;
      z-index: 0;
    }

    .header-image::after {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 21px;
      background: #0a0f23;
      z-index: 1;
    }

    .header-image img {
      position: relative;
      display: block;
      width: calc(100% - 12px);
      height: calc(100% - 12px);
      margin: 6px;
      object-fit: cover;
      border-radius: 18px;
      z-index: 2;
    }

    @keyframes spin {
      from {
        transform: translate(-50%, -50%) rotate(0deg);
      }
      to {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }

    /* ── Container ── */
    .container {
      text-align: center;
      width: 100%;
      max-width: 820px;
      padding: 0 10px;
    }

    .site-title {
      font-size: 2.8rem;
      font-weight: 700;
      color: #aa88ff;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }
    .divider {
      width: 60px;
      height: 3px;
      background: #8a6cff;
      margin: 6px auto 16px auto;
      border-radius: 4px;
    }
    .development-note {
      font-size: 1.2rem;
      color: #aa88ff;
      margin-bottom: 10px;
    }
    .greeting {
      font-size: 2rem;
      font-weight: 500;
      margin-bottom: 6px;
    }
    .typing {
      font-size: 1.5rem;
      font-weight: 300;
      color: #cce0ff;
      min-height: 2.2rem;
    }

    /* ── Tombol Download Map ── */
    .btn-map {
      display: inline-block;
      margin-top: 24px;
      padding: 16px 40px;
      background: linear-gradient(135deg, #00e5ff, #7c4dff);
      border-radius: 16px;
      font-size: 1.2rem;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
      box-shadow: 0 4px 24px rgba(124, 77, 255, 0.4);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .btn-map:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 8px 40px rgba(124, 77, 255, 0.6);
    }
    .btn-map i {
      margin-right: 10px;
    }

    /* ── Footer ── */
    .footer {
      text-align: center;
      color: #aaa;
      margin-top: 40px;
      padding-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 100%;
    }
    .footer-main {
      font-size: 0.9rem;
    }
    .footer-sub {
      font-size: 0.8rem;
      opacity: 0.7;
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .header-image {
        margin-top: 80px;
        border-radius: 18px;
        filter: drop-shadow(0 0 18px rgba(0, 255, 255, 0.2));
      }
      .header-image::before {
        width: 300%;
        height: 300%;
      }
      .header-image::after {
        inset: 2px;
        border-radius: 15px;
      }
      .header-image img {
        width: calc(100% - 8px);
        height: calc(100% - 8px);
        margin: 4px;
        border-radius: 14px;
      }
      .site-title {
        font-size: 2.2rem;
      }
      .greeting {
        font-size: 1.6rem;
      }
      .typing {
        font-size: 1.2rem;
      }
      #menuContainer .menu-panel {
        width: 260px;
      }
      .hamburger {
        top: 16px;
        left: 16px;
        padding: 8px 10px;
      }
      .hamburger span {
        width: 24px;
        height: 2.5px;
      }
      .btn-map {
        padding: 14px 28px;
        font-size: 1rem;
      }
    }

    @media (max-width: 420px) {
      .header-image {
        margin-top: 70px;
        border-radius: 14px;
        filter: drop-shadow(0 0 12px rgba(0, 255, 255, 0.15));
      }
      .header-image::before {
        width: 350%;
        height: 350%;
      }
      .header-image::after {
        inset: 1.5px;
        border-radius: 12px;
      }
      .header-image img {
        width: calc(100% - 6px);
        height: calc(100% - 6px);
        margin: 3px;
        border-radius: 11px;
      }
      .site-title {
        font-size: 1.8rem;
      }
      .greeting {
        font-size: 1.3rem;
      }
      .typing {
        font-size: 1rem;
      }
      #menuContainer .menu-panel {
        width: 240px;
        padding: 20px 16px;
      }
      .btn-map {
        padding: 12px 20px;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

  <!-- ─── TOMBOL HAMBURGER ─── -->
  <div class="hamburger" id="hamburgerBtn" aria-label="Buka menu">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <!-- ─── MENU OVERLAY ─── -->
  <div class="menu-overlay" id="menuOverlay"></div>

  <!-- ─── CONTAINER UNTUK MENU (diisi dari menu.html) ─── -->
  <div id="menuContainer"></div>

  <!-- ─── HEADER IMAGE DENGAN BORDER LIGHTING ─── -->
  <div class="header-image">
    <img src="https://c.termai.cc/i183/m5ecz.jpg" alt="SteveMC Banner" loading="lazy" />
  </div>

  <!-- ─── KONTEN UTAMA ─── -->
  <div class="container">
    <div class="site-title">SteveMC</div>
    <div class="divider"></div>
    <div class="development-note">Website ini masih dalam tahap pengembangan</div>
    <div class="greeting" id="greeting"></div>
    <div class="typing" id="typing"></div>

    <!-- ─── TOMBOL DOWNLOAD MAP MINECRAFT ─── -->
    <a href="downloadmap.html" class="btn-map">
      <i class="fas fa-map"></i> Download Map Minecraft
    </a>
  </div>

  <!-- ─── FOOTER ─── -->
  <footer class="footer">
    <div class="footer-main">©2025 SteveMC Developer</div>
    <div class="footer-sub">Since 15 Desember 2025</div>
  </footer>

  <script>
    // ─────────────────────────────────────────────
    //  LOAD MENU DARI menu.html + ACTIVE LINK OTOMATIS
    // ─────────────────────────────────────────────
    const menuContainer = document.getElementById('menuContainer');
    const hamburger = document.getElementById('hamburgerBtn');
    const menuOverlay = document.getElementById('menuOverlay');

    fetch('menu.html')
      .then(res => {
        if (!res.ok) throw new Error('Menu tidak ditemukan');
        return res.text();
      })
      .then(html => {
        menuContainer.innerHTML = html;
        const menuPanel = document.getElementById('menuPanel');
        if (!menuPanel) return;

        // ── Tandai link aktif berdasarkan halaman saat ini ──
        const currentPage = window.location.pathname.split('/').pop() || 'index.html';
        const allLinks = menuPanel.querySelectorAll('.menu-list a');

        allLinks.forEach(link => {
          const href = link.getAttribute('href');
          link.classList.remove('active');

          if (href === currentPage) {
            link.classList.add('active');
          } else if (href.endsWith('/') && currentPage.startsWith(href.replace('/', ''))) {
            link.classList.add('active');
          }
        });

        // ── Fungsi toggle menu (tanpa efek silang) ──
        function toggleMenu(forceState) {
          const isOpen = typeof forceState === 'boolean' ? forceState : !menuPanel.classList.contains('open');
          menuPanel.classList.toggle('open', isOpen);
          menuOverlay.classList.toggle('open', isOpen);
          // TIDAK menambahkan class 'active' pada hamburger
          document.body.style.overflow = isOpen ? 'hidden' : '';
        }

        // ── Event listeners ──────────────────────────────────
        hamburger.addEventListener('click', () => toggleMenu());
        menuOverlay.addEventListener('click', () => toggleMenu(false));

        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && menuPanel.classList.contains('open')) {
            toggleMenu(false);
          }
        });

        // Tutup menu saat klik link
        menuPanel.querySelectorAll('.menu-list a').forEach(link => {
          link.addEventListener('click', () => {
            if (link.getAttribute('href') !== '#') {
              toggleMenu(false);
            }
          });
        });
      })
      .catch(err => {
        console.warn('Gagal memuat menu:', err);
        menuContainer.innerHTML = '<p style="color:rgba(255,255,255,0.3);padding:12px;">Menu tidak tersedia</p>';
      });

    // ─────────────────────────────────────────────
    //  GREETING & TYPING EFFECT
    // ─────────────────────────────────────────────
    const greetingEl = document.getElementById('greeting');
    const hour = new Date().getHours();
    let greetingText = 'Selamat pagi';
    if (hour >= 12 && hour < 15) greetingText = 'Selamat siang';
    else if (hour >= 15 && hour < 18) greetingText = 'Selamat sore';
    else if (hour >= 18 || hour < 4) greetingText = 'Selamat malam';
    greetingEl.textContent = greetingText;

    const typingEl = document.getElementById('typing');
    const text = 'Welcome to website SteveMC';
    let index = 0;
    function type() {
      if (index < text.length) {
        typingEl.textContent += text.charAt(index);
        index++;
        setTimeout(type, 120);
      }
    }
    type();
  </script>

</body>
</html>
