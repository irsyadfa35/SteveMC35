<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="theme-color" content="#0a0f23" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar - SteveMC</title>

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="https://c.termai.cc/i131/K4M.jpg" />

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- ===== SUPABASE JS SDK v2 ===== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ============================================
       RESET & BASE (Tidak ada perubahan)
    ============================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #080c1a;
      color: #c8d6e5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      padding: 20px;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(ellipse at 20% 50%, rgba(124, 77, 255, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(0, 229, 255, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(255, 0, 80, 0.05) 0%, transparent 50%);
      z-index: 0;
      pointer-events: none;
    }

    /* Floating particles */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(167, 139, 250, 0.3);
      border-radius: 50%;
      animation: float-particle linear infinite;
    }

    @keyframes float-particle {
      0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) scale(1);
        opacity: 0;
      }
    }

    /* ============================================
       SCROLLBAR
    ============================================ */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #080c1a;
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #7c4dff, #00e5ff);
      border-radius: 10px;
    }

    /* ============================================
       REGISTER CONTAINER
    ============================================ */
    .register-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
    }

    .register-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 40px 36px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    /* Back button */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.4);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.3s ease;
      margin-bottom: 24px;
    }

    .back-btn:hover {
      color: #a78bfa;
      transform: translateX(-4px);
    }

    .back-btn i {
      font-size: 0.8rem;
    }

    /* Header */
    .register-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .register-header .brand-icon {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #7c4dff, #00e5ff);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #fff;
      margin: 0 auto 16px;
      box-shadow: 0 8px 30px rgba(124, 77, 255, 0.3);
    }

    .register-header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .register-header h1 span {
      background: linear-gradient(135deg, #7c4dff, #00e5ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .register-header p {
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.95rem;
      margin-top: 6px;
    }

    /* ===== ERROR MESSAGE ===== */
    .error-message {
      display: none;
      background: rgba(255, 0, 0, 0.1);
      border: 1px solid rgba(255, 0, 0, 0.2);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 16px;
      color: #ff6b6b;
      font-size: 0.9rem;
      text-align: center;
    }

    .error-message.show {
      display: block;
    }

    .error-message i {
      margin-right: 8px;
    }

    /* ===== SUCCESS MESSAGE ===== */
    .success-message {
      display: none;
      background: rgba(37, 211, 102, 0.1);
      border: 1px solid rgba(37, 211, 102, 0.2);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 16px;
      color: #25D366;
      font-size: 0.9rem;
      text-align: center;
    }

    .success-message.show {
      display: block;
    }

    .success-message i {
      margin-right: 8px;
    }

    /* Form */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 6px;
    }

    .form-group .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      transition: all 0.3s ease;
    }

    .form-group .input-wrapper:focus-within {
      border-color: rgba(124, 77, 255, 0.4);
      box-shadow: 0 0 0 3px rgba(124, 77, 255, 0.1);
    }

    .form-group .input-wrapper i {
      position: absolute;
      left: 16px;
      color: rgba(255, 255, 255, 0.2);
      font-size: 1.1rem;
      transition: color 0.3s;
    }

    .form-group .input-wrapper:focus-within i {
      color: #7c4dff;
    }

    .form-group .input-wrapper input {
      width: 100%;
      padding: 14px 16px 14px 48px;
      background: transparent;
      border: none;
      color: #c8d6e5;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
    }

    .form-group .input-wrapper input::placeholder {
      color: rgba(255, 255, 255, 0.2);
    }

    .form-group .input-wrapper .toggle-password {
      position: absolute;
      right: 16px;
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.2);
      cursor: pointer;
      font-size: 1rem;
      transition: color 0.3s;
      padding: 4px;
    }

    .form-group .input-wrapper .toggle-password:hover {
      color: rgba(255, 255, 255, 0.5);
    }

    /* Terms */
    .terms {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 6px 0 24px;
    }

    .terms input[type="checkbox"] {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      position: relative;
      transition: all 0.3s ease;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .terms input[type="checkbox"]:checked {
      background: linear-gradient(135deg, #7c4dff, #00e5ff);
      border-color: #7c4dff;
    }

    .terms input[type="checkbox"]:checked::after {
      content: '\f00c';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 10px;
      color: #fff;
    }

    .terms label {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.4);
      cursor: pointer;
      line-height: 1.5;
    }

    .terms label a {
      color: #a78bfa;
      text-decoration: none;
      transition: color 0.3s;
    }

    .terms label a:hover {
      color: #7c4dff;
      text-decoration: underline;
    }

    /* Button */
    .btn-register {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #7c4dff, #00e5ff);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      box-shadow: 0 4px 30px rgba(124, 77, 255, 0.3);
    }

    .btn-register:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 8px 50px rgba(124, 77, 255, 0.5);
    }

    .btn-register:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-register:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-register .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .btn-register.loading .spinner {
      display: block;
    }

    .btn-register.loading .btn-text {
      display: none;
    }

    .btn-register.loading .btn-icon {
      display: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 24px 0;
    }

    .divider .line {
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.06);
    }

    .divider span {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.2);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Social Register */
    .social-register {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn-social {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.03);
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      text-decoration: none;
    }

    .btn-social:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.12);
      color: #fff;
      transform: translateY(-2px);
    }

    .btn-social:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-social i {
      font-size: 1.2rem;
    }

    .btn-social .fa-google { color: #ea4335; }
    .btn-social .fa-github { color: #f0f6fc; }
    .btn-social .fa-discord { color: #5865F2; }
    .btn-social .fa-twitter { color: #1DA1F2; }

    /* Login link */
    .login-link {
      text-align: center;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.4);
    }

    .login-link a {
      color: #a78bfa;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
    }

    .login-link a:hover {
      color: #7c4dff;
      text-decoration: underline;
    }

    /* ============================================
       RESPONSIVE
    ============================================ */
    @media (max-width: 480px) {
      .register-card {
        padding: 28px 20px;
        border-radius: 20px;
      }

      .register-header h1 {
        font-size: 1.5rem;
      }

      .register-header .brand-icon {
        width: 50px;
        height: 50px;
        font-size: 22px;
      }

      .social-register {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .btn-social {
        font-size: 0.8rem;
        padding: 10px;
      }

      .back-btn {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

  <!-- ============================================
       PARTICLES BACKGROUND
  ============================================ -->
  <div class="particles" id="particles"></div>

  <!-- ============================================
       REGISTER CONTAINER
  ============================================ -->
  <div class="register-container">

    <div class="register-card">

      <!-- Back Button -->
      <a href="index.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> Kembali
      </a>

      <!-- Header -->
      <div class="register-header">
        <div class="brand-icon">
          <i class="fas fa-gamepad"></i>
        </div>
        <h1>Daftar <span>SteveMC</span></h1>
        <p>Buat akun baru untuk bergabung</p>
      </div>

      <!-- ===== ERROR MESSAGE ===== -->
      <div class="error-message" id="errorMessage">
        <i class="fas fa-exclamation-circle"></i>
        <span id="errorText">Terjadi kesalahan</span>
      </div>

      <!-- ===== SUCCESS MESSAGE ===== -->
      <div class="success-message" id="successMessage">
        <i class="fas fa-check-circle"></i>
        <span id="successText">Pendaftaran berhasil!</span>
      </div>

      <!-- ===== FORM REGISTER ===== -->
      <form id="registerForm" novalidate>
        <!-- Username -->
        <div class="form-group">
          <label>Username</label>
          <div class="input-wrapper">
            <i class="fas fa-user"></i>
            <input type="text" id="usernameInput" placeholder="Masukkan username" required minlength="3" />
          </div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label>Email</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope"></i>
            <input type="email" id="emailInput" placeholder="Masukkan email" required />
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label>Kata Sandi</label>
          <div class="input-wrapper">
            <i class="fas fa-lock"></i>
            <input type="password" id="passwordInput" placeholder="Minimal 8 karakter" required minlength="8" />
            <button type="button" class="toggle-password" onclick="togglePassword()">
              <i class="fas fa-eye" id="toggleIcon"></i>
            </button>
          </div>
        </div>

        <!-- Konfirmasi Password -->
        <div class="form-group">
          <label>Konfirmasi Kata Sandi</label>
          <div class="input-wrapper">
            <i class="fas fa-check-circle"></i>
            <input type="password" id="confirmPasswordInput" placeholder="Ulangi kata sandi" required />
          </div>
        </div>

        <!-- Terms -->
        <div class="terms">
          <input type="checkbox" id="termsCheck" required />
          <label for="termsCheck">
            Saya menyetujui <a href="#">Syarat &amp; Ketentuan</a> dan <a href="#">Kebijakan Privasi</a>
          </label>
        </div>

        <!-- Register Button -->
        <button type="submit" class="btn-register" id="registerBtn">
          <span class="btn-icon"><i class="fas fa-user-plus"></i></span>
          <span class="btn-text">Daftar</span>
          <span class="spinner"></span>
        </button>
      </form>

      <!-- Divider -->
      <div class="divider">
        <div class="line"></div>
        <span>atau</span>
        <div class="line"></div>
      </div>

      <!-- ===== SOCIAL REGISTER ===== -->
      <div class="social-register">
        <!-- GOOGLE - Terhubung dengan Supabase OAuth -->
        <button class="btn-social" id="googleRegisterBtn">
          <i class="fab fa-google"></i> Google
        </button>

        <!-- GITHUB - Belum diaktifkan -->
        <button class="btn-social" id="githubRegisterBtn" disabled>
          <i class="fab fa-github"></i> GitHub
        </button>

        <!-- DISCORD - Belum diaktifkan -->
        <button class="btn-social" id="discordRegisterBtn" disabled>
          <i class="fab fa-discord"></i> Discord
        </button>

        <!-- TWITTER - Belum diaktifkan -->
        <button class="btn-social" id="twitterRegisterBtn" disabled>
          <i class="fab fa-twitter"></i> Twitter
        </button>
      </div>

      <!-- Login Link -->
      <div class="login-link">
        Sudah punya akun? <a href="login.html">Masuk sekarang</a>
      </div>

    </div>

  </div>

  <script>
    // ============================================================
    // 1. SUPABASE KONFIGURASI
    // ============================================================
    const SUPABASE_URL = 'https://ydcdfnvtacwrrhcbsjdk.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_DABKAaVwkW5LvR7oP-pDNQ_9SyGiBrI';

    // Inisialisasi Supabase Client
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ============================================================
    // 2. PARTICLES BACKGROUND (tetap)
    // ============================================================
    (function createParticles() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 40; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.width = (2 + Math.random() * 4) + 'px';
        p.style.height = p.style.width;
        p.style.animationDuration = (15 + Math.random() * 25) + 's';
        p.style.animationDelay = (Math.random() * 20) + 's';
        p.style.opacity = 0.2 + Math.random() * 0.3;
        container.appendChild(p);
      }
    })();

    // ============================================================
    // 3. TOGGLE PASSWORD (tetap)
    // ============================================================
    function togglePassword() {
      const passwordInput = document.getElementById('passwordInput');
      const toggleIcon = document.getElementById('toggleIcon');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.className = 'fas fa-eye-slash';
      } else {
        passwordInput.type = 'password';
        toggleIcon.className = 'fas fa-eye';
      }
    }

    // ============================================================
    // 4. ELEMENT REFERENSI
    // ============================================================
    const registerForm = document.getElementById('registerForm');
    const registerBtn = document.getElementById('registerBtn');
    const usernameInput = document.getElementById('usernameInput');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const confirmPasswordInput = document.getElementById('confirmPasswordInput');
    const termsCheck = document.getElementById('termsCheck');
    const errorMessage = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');
    const successMessage = document.getElementById('successMessage');
    const successText = document.getElementById('successText');
    const googleRegisterBtn = document.getElementById('googleRegisterBtn');

    // ============================================================
    // 5. FUNGSI UTILITY
    // ============================================================
    function showError(message) {
      errorText.textContent = message;
      errorMessage.classList.add('show');
      successMessage.classList.remove('show');
      setTimeout(() => {
        errorMessage.classList.remove('show');
      }, 6000);
    }

    function showSuccess(message) {
      successText.textContent = message;
      successMessage.classList.add('show');
      errorMessage.classList.remove('show');
    }

    function hideAllMessages() {
      errorMessage.classList.remove('show');
      successMessage.classList.remove('show');
    }

    function setLoading(isLoading) {
      registerBtn.disabled = isLoading;
      registerBtn.classList.toggle('loading', isLoading);
      usernameInput.disabled = isLoading;
      emailInput.disabled = isLoading;
      passwordInput.disabled = isLoading;
      confirmPasswordInput.disabled = isLoading;
      termsCheck.disabled = isLoading;
    }

    // ============================================================
    // 6. VALIDASI FORM
    // ============================================================
    function validateForm() {
      const username = usernameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;
      const termsChecked = termsCheck.checked;

      // Validasi Username
      if (!username) {
        showError('Username wajib diisi.');
        return false;
      }
      if (username.length < 3) {
        showError('Username minimal 3 karakter.');
        return false;
      }

      // Validasi Email
      if (!email) {
        showError('Email wajib diisi.');
        return false;
      }
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showError('Masukkan email yang valid.');
        return false;
      }

      // Validasi Password
      if (!password) {
        showError('Kata sandi wajib diisi.');
        return false;
      }
      if (password.length < 8) {
        showError('Kata sandi minimal 8 karakter.');
        return false;
      }

      // Validasi Konfirmasi Password
      if (!confirmPassword) {
        showError('Konfirmasi kata sandi wajib diisi.');
        return false;
      }
      if (password !== confirmPassword) {
        showError('Kata sandi dan konfirmasi tidak sama.');
        return false;
      }

      // Validasi Terms
      if (!termsChecked) {
        showError('Harap setujui Syarat &amp; Ketentuan.');
        return false;
      }

      hideAllMessages();
      return true;
    }

    // ============================================================
    // 7. REGISTER - SUPABASE AUTH
    // ============================================================
    async function handleRegister(e) {
      e.preventDefault();

      // Validasi form
      if (!validateForm()) {
        return;
      }

      // Ambil data dari form
      const username = usernameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      // Set loading state
      setLoading(true);
      hideAllMessages();

      try {
        console.log('📝 Mendaftarkan user:', email);

        // ===== REGISTER KE SUPABASE =====
        const { data, error } = await supabaseClient.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              username: username,
              full_name: username
            }
          }
        });

        // ===== HANDLE ERROR =====
        if (error) {
          console.error('❌ Register error:', error);

          // Handle error spesifik
          if (error.message.includes('User already registered')) {
            showError('Email sudah terdaftar. Silakan gunakan email lain atau login.');
          } else if (error.message.includes('Password should be at least')) {
            showError('Kata sandi minimal 8 karakter.');
          } else if (error.message.includes('Invalid email')) {
            showError('Email tidak valid. Periksa kembali email Anda.');
          } else {
            showError('Gagal mendaftar: ' + error.message);
          }
          setLoading(false);
          return;
        }

        // ===== REGISTER BERHASIL =====
        console.log('✅ Register berhasil:', data);

        const session = data.session;
        const user = data.user;

        if (session) {
          // Session langsung tersedia (email tidak perlu verifikasi)
          showSuccess('Pendaftaran berhasil! Mengalihkan...');
          setTimeout(() => {
            window.location.href = 'https://stevemc.my.id/';
          }, 1500);
        } else if (user && user.identities && user.identities.length === 0) {
          // User sudah terdaftar tapi belum login
          showError('Email sudah terdaftar. Silakan login.');
          setLoading(false);
        } else {
          // Verifikasi email aktif - session belum tersedia
          showSuccess('Pendaftaran berhasil! Silakan cek email Anda untuk verifikasi.');
          setTimeout(() => {
            window.location.href = 'https://stevemc.my.id/login.html';
          }, 3000);
        }

        setLoading(false);

      } catch (error) {
        // ===== HANDLE ERROR TAK TERDUGA =====
        console.error('❌ Unexpected error:', error);
        showError('Terjadi kesalahan. Silakan coba lagi.');
        setLoading(false);
      }
    }

    // ============================================================
    // 8. GOOGLE OAUTH - REGISTER/LOGIN
    // ============================================================
    async function handleGoogleRegister() {
      hideAllMessages();

      try {
        console.log('🔐 Login/Register dengan Google');

        const { data, error } = await supabaseClient.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: 'https://stevemc.my.id/',
            queryParams: {
              access_type: 'offline',
              prompt: 'consent',
            }
          }
        });

        if (error) {
          console.error('❌ Google OAuth error:', error);
          showError('Gagal login dengan Google: ' + error.message);
          return;
        }

        // Supabase akan redirect ke Google OAuth page
        console.log('✅ Redirect ke Google OAuth...');

      } catch (error) {
        console.error('❌ Unexpected Google OAuth error:', error);
        showError('Terjadi kesalahan saat login dengan Google.');
      }
    }

    // ============================================================
    // 9. EVENT LISTENERS
    // ============================================================

    // Register form submit
    registerForm.addEventListener('submit', handleRegister);

    // Google register button
    googleRegisterBtn.addEventListener('click', handleGoogleRegister);

    // Enter key support untuk form
    registerForm.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleRegister(e);
      }
    });

    // ============================================================
    // 10. CEK SESSION - Jika sudah login, redirect ke beranda
    // ============================================================
    (async function checkSession() {
      try {
        const { data: { session }, error } = await supabaseClient.auth.getSession();

        if (error) {
          console.warn('Error checking session:', error);
          return;
        }

        if (session) {
          console.log('✅ User sudah login, redirect ke beranda');
          window.location.href = 'https://stevemc.my.id/';
        }

      } catch (err) {
        console.error('Error checking session:', err);
      }
    })();

    // ============================================================
    // 11. SUPABASE AUTH STATE CHANGE
    // ============================================================
    supabaseClient.auth.onAuthStateChange((event, session) => {
      console.log('🔐 Auth state changed:', event);

      if (event === 'SIGNED_IN' && session) {
        console.log('✅ User signed in, redirecting...');
        window.location.href = 'https://stevemc.my.id/';
      }
    });

    console.log('%c📝 Register Page Ready!', 'font-size:16px;font-weight:bold;color:#7c4dff;');
    console.log('📌 Supabase URL:', SUPABASE_URL);
    console.log('📌 Redirect URL: https://stevemc.my.id/');
    console.log('📌 Register dengan email/password atau Google');
  </script>

</body>
