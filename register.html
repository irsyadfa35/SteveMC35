<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="theme-color" content="#0a0f23" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar - SteveMC</title>

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="https://c.termai.cc/i131/K4M.jpg" />

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    /* ============================================
       RESET & BASE
    ============================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #080c1a;
      color: #c8d6e5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      padding: 20px;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(ellipse at 20% 50%, rgba(124, 77, 255, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(0, 229, 255, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(255, 0, 80, 0.05) 0%, transparent 50%);
      z-index: 0;
      pointer-events: none;
    }

    /* Floating particles */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(167, 139, 250, 0.3);
      border-radius: 50%;
      animation: float-particle linear infinite;
    }

    @keyframes float-particle {
      0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) scale(1);
        opacity: 0;
      }
    }

    /* ============================================
       SCROLLBAR
    ============================================ */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #080c1a;
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #7c4dff, #00e5ff);
      border-radius: 10px;
    }

    /* ============================================
       REGISTER CONTAINER
    ============================================ */
    .register-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
    }

    .register-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 40px 36px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    /* Back button */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.4);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.3s ease;
      margin-bottom: 24px;
    }

    .back-btn:hover {
      color: #a78bfa;
      transform: translateX(-4px);
    }

    .back-btn i {
      font-size: 0.8rem;
    }

    /* Header */
    .register-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .register-header .brand-icon {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #7c4dff, #00e5ff);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #fff;
      margin: 0 auto 16px;
      box-shadow: 0 8px 30px rgba(124, 77, 255, 0.3);
    }

    .register-header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .register-header h1 span {
      background: linear-gradient(135deg, #7c4dff, #00e5ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .register-header p {
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.95rem;
      margin-top: 6px;
    }

    /* Form */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 6px;
    }

    .form-group .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      transition: all 0.3s ease;
    }

    .form-group .input-wrapper:focus-within {
      border-color: rgba(124, 77, 255, 0.4);
      box-shadow: 0 0 0 3px rgba(124, 77, 255, 0.1);
    }

    .form-group .input-wrapper i {
      position: absolute;
      left: 16px;
      color: rgba(255, 255, 255, 0.2);
      font-size: 1.1rem;
      transition: color 0.3s;
    }

    .form-group .input-wrapper:focus-within i {
      color: #7c4dff;
    }

    .form-group .input-wrapper input {
      width: 100%;
      padding: 14px 16px 14px 48px;
      background: transparent;
      border: none;
      color: #c8d6e5;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
    }

    .form-group .input-wrapper input::placeholder {
      color: rgba(255, 255, 255, 0.2);
    }

    .form-group .input-wrapper .toggle-password {
      position: absolute;
      right: 16px;
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.2);
      cursor: pointer;
      font-size: 1rem;
      transition: color 0.3s;
      padding: 4px;
    }

    .form-group .input-wrapper .toggle-password:hover {
      color: rgba(255, 255, 255, 0.5);
    }

    /* Terms */
    .terms {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 6px 0 24px;
    }

    .terms input[type="checkbox"] {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      position: relative;
      transition: all 0.3s ease;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .terms input[type="checkbox"]:checked {
      background: linear-gradient(135deg, #7c4dff, #00e5ff);
      border-color: #7c4dff;
    }

    .terms input[type="checkbox"]:checked::after {
      content: '\f00c';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 10px;
      color: #fff;
    }

    .terms label {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.4);
      cursor: pointer;
      line-height: 1.5;
    }

    .terms label a {
      color: #a78bfa;
      text-decoration: none;
      transition: color 0.3s;
    }

    .terms label a:hover {
      color: #7c4dff;
      text-decoration: underline;
    }

    /* Button */
    .btn-register {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #7c4dff, #00e5ff);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      box-shadow: 0 4px 30px rgba(124, 77, 255, 0.3);
    }

    .btn-register:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 50px rgba(124, 77, 255, 0.5);
    }

    .btn-register:active {
      transform: scale(0.98);
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 24px 0;
    }

    .divider .line {
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.06);
    }

    .divider span {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.2);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Social Register */
    .social-register {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn-social {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.03);
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      text-decoration: none;
    }

    .btn-social:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.12);
      color: #fff;
      transform: translateY(-2px);
    }

    .btn-social i {
      font-size: 1.2rem;
    }

    .btn-social .fa-google { color: #ea4335; }
    .btn-social .fa-github { color: #f0f6fc; }
    .btn-social .fa-discord { color: #5865F2; }
    .btn-social .fa-twitter { color: #1DA1F2; }

    /* Login link */
    .login-link {
      text-align: center;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.4);
    }

    .login-link a {
      color: #a78bfa;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
    }

    .login-link a:hover {
      color: #7c4dff;
      text-decoration: underline;
    }

    /* ============================================
       RESPONSIVE
    ============================================ */
    @media (max-width: 480px) {
      .register-card {
        padding: 28px 20px;
        border-radius: 20px;
      }

      .register-header h1 {
        font-size: 1.5rem;
      }

      .register-header .brand-icon {
        width: 50px;
        height: 50px;
        font-size: 22px;
      }

      .social-register {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .btn-social {
        font-size: 0.8rem;
        padding: 10px;
      }

      .back-btn {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

  <!-- ============================================
       PARTICLES BACKGROUND
  ============================================ -->
  <div class="particles" id="particles"></div>

  <!-- ============================================
       REGISTER CONTAINER
  ============================================ -->
  <div class="register-container">

    <div class="register-card">

      <!-- Back Button -->
      <a href="index.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> Kembali
      </a>

      <!-- Header -->
      <div class="register-header">
        <div class="brand-icon">
          <i class="fas fa-gamepad"></i>
        </div>
        <h1>Daftar <span>SteveMC</span></h1>
        <p>Buat akun baru untuk bergabung</p>
      </div>

      <!-- Form -->
      <form id="registerForm" onsubmit="return false;">
        <div class="form-group">
          <label>Username</label>
          <div class="input-wrapper">
            <i class="fas fa-user"></i>
            <input type="text" placeholder="Masukkan username" required />
          </div>
        </div>

        <div class="form-group">
          <label>Email</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope"></i>
            <input type="email" placeholder="Masukkan email" required />
          </div>
        </div>

        <div class="form-group">
          <label>Kata Sandi</label>
          <div class="input-wrapper">
            <i class="fas fa-lock"></i>
            <input type="password" id="passwordInput" placeholder="Minimal 8 karakter" required />
            <button type="button" class="toggle-password" onclick="togglePassword()">
              <i class="fas fa-eye" id="toggleIcon"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label>Konfirmasi Kata Sandi</label>
          <div class="input-wrapper">
            <i class="fas fa-check-circle"></i>
            <input type="password" placeholder="Ulangi kata sandi" required />
          </div>
        </div>

        <div class="terms">
          <input type="checkbox" id="termsCheck" required />
          <label for="termsCheck">
            Saya menyetujui <a href="#">Syarat &amp; Ketentuan</a> dan <a href="#">Kebijakan Privasi</a>
          </label>
        </div>

        <button type="submit" class="btn-register">
          <i class="fas fa-user-plus"></i> Daftar
        </button>
      </form>

      <!-- Divider -->
      <div class="divider">
        <div class="line"></div>
        <span>atau</span>
        <div class="line"></div>
      </div>

      <!-- Social Register -->
      <div class="social-register">
        <button class="btn-social" onclick="alert('Daftar dengan Google')">
          <i class="fab fa-google"></i> Google
        </button>
        <button class="btn-social" onclick="alert('Daftar dengan GitHub')">
          <i class="fab fa-github"></i> GitHub
        </button>
        <button class="btn-social" onclick="alert('Daftar dengan Discord')">
          <i class="fab fa-discord"></i> Discord
        </button>
        <button class="btn-social" onclick="alert('Daftar dengan Twitter')">
          <i class="fab fa-twitter"></i> Twitter
        </button>
      </div>

      <!-- Login Link -->
      <div class="login-link">
        Sudah punya akun? <a href="login.html">Masuk sekarang</a>
      </div>

    </div>

  </div>

  <script>
    // ============================================
    // PARTICLES
    // ============================================
    (function createParticles() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 40; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.width = (2 + Math.random() * 4) + 'px';
        p.style.height = p.style.width;
        p.style.animationDuration = (15 + Math.random() * 25) + 's';
        p.style.animationDelay = (Math.random() * 20) + 's';
        p.style.opacity = 0.2 + Math.random() * 0.3;
        container.appendChild(p);
      }
    })();

    // ============================================
    // TOGGLE PASSWORD
    // ============================================
    function togglePassword() {
      const passwordInput = document.getElementById('passwordInput');
      const toggleIcon = document.getElementById('toggleIcon');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.className = 'fas fa-eye-slash';
      } else {
        passwordInput.type = 'password';
        toggleIcon.className = 'fas fa-eye';
      }
    }

    // ============================================
    // REGISTER FORM SUBMIT
    // ============================================
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const termsChecked = document.getElementById('termsCheck').checked;
      if (!termsChecked) {
        alert('Harap setujui Syarat & Ketentuan terlebih dahulu!');
        return;
      }
      alert('Fitur pendaftaran sedang dalam pengembangan. Terima kasih!');
    });
  </script>

</body>
</html>
