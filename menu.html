<script>
  // ============================================================
  // AUTO-LOAD USER PROFILE KE MENU
  // ============================================================
  (function loadUserProfile() {
    // Cek apakah Supabase sudah terdefinisi
    if (typeof supabaseClient === 'undefined') {
      console.warn('⚠️ Supabase tidak ditemukan, coba inisialisasi ulang');
      // Coba ambil dari window jika ada
      if (window.supabaseClient) {
        loadProfile(window.supabaseClient);
      }
      return;
    }

    loadProfile(supabaseClient);

    async function loadProfile(supabase) {
      try {
        const { data: { session }, error } = await supabase.auth.getSession();

        if (error) {
          console.warn('Error get session:', error);
          return;
        }

        const container = document.getElementById('userProfileContainer');
        if (!container) return;

        if (session && session.user) {
          const user = session.user;
          const name = user.user_metadata?.full_name || user.user_metadata?.name || user.email || 'User';
          const email = user.email || '';
          const avatar = user.user_metadata?.avatar_url || user.user_metadata?.picture || '';
          const initial = name.charAt(0).toUpperCase();

          container.innerHTML = `
            <div class="user-profile">
              ${avatar 
                ? `<img class="avatar" src="${avatar}" alt="Avatar" />` 
                : `<div class="avatar" style="background:linear-gradient(135deg,#7c4dff,#00e5ff);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.2rem;color:#fff;">${initial}</div>`
              }
              <div class="info">
                <div class="name">${name}</div>
                <div class="email">${email}</div>
              </div>
            </div>
            <button class="btn-logout-sidebar" id="logoutSidebarBtn">
              <i class="fas fa-sign-out-alt"></i> Logout
            </button>
          `;

          // Event listener logout
          const logoutBtn = document.getElementById('logoutSidebarBtn');
          if (logoutBtn) {
            logoutBtn.addEventListener('click', async () => {
              await supabase.auth.signOut();
              window.location.replace('https://stevemc.my.id/login.html');
            });
          }

        } else {
          // Tidak ada session, tampilkan tombol login
          container.innerHTML = `
            <a href="login.html" class="btn-login-sidebar">
              <i class="fas fa-sign-in-alt"></i> Login
            </a>
          `;
        }

      } catch (err) {
        console.error('Error loading user profile:', err);
      }
    }
  })();
</script>
