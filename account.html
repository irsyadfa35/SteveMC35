<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="theme-color" content="#0a0f23" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Informasi Akun - SteveMC</title>

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="https://c.termai.cc/i131/K4M.jpg" />

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- ===== SUPABASE JS SDK v2 ===== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ============================================
       RESET & BASE (Sama seperti sebelumnya)
    ============================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #080c1a;
      color: #c8d6e5;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(ellipse at 20% 50%, rgba(124, 77, 255, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(0, 229, 255, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(255, 0, 80, 0.05) 0%, transparent 50%);
      z-index: 0;
      pointer-events: none;
    }

    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(167, 139, 250, 0.3);
      border-radius: 50%;
      animation: float-particle linear infinite;
    }

    @keyframes float-particle {
      0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) scale(1);
        opacity: 0;
      }
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #080c1a;
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #7c4dff, #00e5ff);
      border-radius: 10px;
    }

    /* ============================================
       HAMBURGER
    ============================================ */
    .hamburger {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 1001;
      display: flex;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      opacity: 1;
      visibility: visible;
    }

    .hamburger:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(124, 77, 255, 0.3);
    }

    .hamburger span {
      display: block;
      width: 28px;
      height: 2.5px;
      background: #c8d6e5;
      border-radius: 4px;
      transition: all 0.3s ease;
    }

    .hamburger.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: scale(0.8);
    }

    /* ============================================
       MENU OVERLAY
    ============================================ */
    .menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .menu-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    /* ============================================
       MENU PANEL
    ============================================ */
    #menuContainer .menu-panel {
      position: fixed;
      top: 0;
      left: 0;
      width: 300px;
      height: 100%;
      background: rgba(12, 16, 30, 0.98);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 4px 0 60px rgba(0, 0, 0, 0.6);
      z-index: 1000;
      transform: translateX(-100%);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
    }

    #menuContainer .menu-panel.open {
      transform: translateX(0);
    }

    #menuContainer .menu-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 28px;
    }

    #menuContainer .menu-header .brand-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #7c4dff, #00e5ff);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #fff;
      box-shadow: 0 4px 20px rgba(124, 77, 255, 0.3);
    }

    #menuContainer .menu-header .brand-text {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }

    #menuContainer .menu-header .brand-text span {
      background: linear-gradient(90deg, #7c4dff, #00e5ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #menuContainer .menu-list {
      list-style: none;
      flex: 1;
    }

    #menuContainer .menu-list li {
      margin-bottom: 4px;
    }

    #menuContainer .menu-list li a {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 16px;
      border-radius: 12px;
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.25s ease;
      position: relative;
    }

    #menuContainer .menu-list li a::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%) scaleY(0);
      width: 3px;
      height: 24px;
      background: linear-gradient(180deg, #7c4dff, #00e5ff);
      border-radius: 0 4px 4px 0;
      transition: transform 0.3s ease;
    }

    #menuContainer .menu-list li a:hover::before,
    #menuContainer .menu-list li a.active::before {
      transform: translateY(-50%) scaleY(1);
    }

    #menuContainer .menu-list li a:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
    }

    #menuContainer .menu-list li a i {
      width: 24px;
      font-size: 18px;
      text-align: center;
      color: rgba(255, 255, 255, 0.35);
      transition: color 0.3s;
    }

    #menuContainer .menu-list li a:hover i,
    #menuContainer .menu-list li a.active i {
      color: #7c4dff;
    }

    #menuContainer .menu-list li a.active {
      background: rgba(124, 77, 255, 0.12);
      color: #fff;
      border-right: 3px solid #7c4dff;
    }

    #menuContainer .menu-footer {
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 20px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.25);
      text-align: center;
    }

    #menuContainer .menu-footer i {
      color: #7c4dff;
      margin: 0 4px;
    }

    /* ============================================
       MAIN CONTENT
    ============================================ */
    .main-wrapper {
      position: relative;
      z-index: 1;
      flex: 1;
      max-width: 1000px;
      margin: 0 auto;
      padding: 90px 24px 40px;
      width: 100%;
    }

    /* ============================================
       PAGE HEADER
    ============================================ */
    .page-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }

    .page-header .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.6);
      font-size: 1.1rem;
      text-decoration: none;
      transition: all 0.3s ease;
      flex-shrink: 0;
    }

    .page-header .back-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border-color: rgba(124, 77, 255, 0.3);
      transform: translateX(-3px);
    }

    .page-header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .page-header h1 span {
      background: linear-gradient(135deg, #7c4dff, #00e5ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ===== OWNER BADGE DI HEADER ===== */
    .owner-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, #ffd700, #f59e0b);
      color: #1a1a2e;
      padding: 4px 14px;
      border-radius: 60px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-left: 8px;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
    }

    .owner-badge i {
      font-size: 0.65rem;
    }

    /* ============================================
       LOADING STATE
    ============================================ */
    .loading-state {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255, 255, 255, 0.3);
    }

    .loading-state i {
      font-size: 40px;
      margin-bottom: 12px;
      display: block;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ============================================
       ACCOUNT CARD
    ============================================ */
    .account-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      overflow: hidden;
      margin-bottom: 24px;
    }

    .profile-header {
      padding: 32px 32px 24px;
      display: flex;
      align-items: center;
      gap: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #7c4dff;
      flex-shrink: 0;
      background: linear-gradient(135deg, #7c4dff, #00e5ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 700;
      color: #fff;
    }

    .profile-info h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
    }

    .profile-info .email {
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.95rem;
      margin-top: 2px;
    }

    .profile-info .member-since {
      color: rgba(255, 255, 255, 0.25);
      font-size: 0.8rem;
      margin-top: 4px;
    }

    .profile-info .member-since i {
      margin-right: 4px;
      color: #7c4dff;
    }

    .account-details {
      padding: 24px 32px 32px;
    }

    .detail-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-row .label {
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.9rem;
    }

    .detail-row .label i {
      width: 20px;
      color: #7c4dff;
      font-size: 1rem;
    }

    .detail-row .value {
      color: #c8d6e5;
      font-size: 0.95rem;
      font-weight: 500;
      text-align: right;
      word-break: break-all;
    }

    .detail-row .value .badge {
      display: inline-block;
      padding: 2px 12px;
      border-radius: 60px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      background: rgba(37, 211, 102, 0.15);
      color: #25D366;
      border: 1px solid rgba(37, 211, 102, 0.15);
    }

    /* ===== OWNER BADGE DI VALUE ===== */
    .value .owner-role-badge {
      display: inline-block;
      padding: 2px 12px;
      border-radius: 60px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffd700, #f59e0b);
      color: #1a1a2e;
      border: none;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.15);
    }

    .value .owner-role-badge i {
      margin-right: 4px;
      font-size: 0.65rem;
    }

    /* ============================================
       ACTION BUTTONS
    ============================================ */
    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 4px;
    }

    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.03);
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      text-decoration: none;
      text-align: center;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.12);
      color: #fff;
      transform: translateY(-2px);
    }

    .btn-action.primary {
      background: linear-gradient(135deg, #7c4dff, #00e5ff);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 4px 20px rgba(124, 77, 255, 0.2);
    }

    .btn-action.primary:hover {
      box-shadow: 0 8px 30px rgba(124, 77, 255, 0.4);
      border-color: transparent;
    }

    .btn-action.danger {
      color: #ff6b6b;
      border-color: rgba(255, 0, 0, 0.08);
    }

    .btn-action.danger:hover {
      background: rgba(255, 0, 0, 0.06);
      border-color: rgba(255, 0, 0, 0.15);
      color: #ff6b6b;
    }

    .btn-action i {
      font-size: 1rem;
    }

    /* ============================================
       FOOTER
    ============================================ */
    .footer {
      text-align: center;
      padding: 30px 24px 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      position: relative;
      z-index: 1;
    }

    .footer .brand {
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .footer .brand span {
      background: linear-gradient(90deg, #7c4dff, #00e5ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .footer .copyright {
      font-size: 0.85rem;
      color: rgba(200, 214, 229, 0.25);
      margin-top: 4px;
    }

    .footer .copyright i {
      color: #7c4dff;
      margin: 0 4px;
    }

    /* ============================================
       RESPONSIVE
    ============================================ */
    @media (max-width: 768px) {
      .main-wrapper {
        padding: 80px 16px 30px;
      }

      .page-header h1 {
        font-size: 1.5rem;
      }

      .profile-header {
        flex-direction: column;
        text-align: center;
        padding: 24px 20px;
        gap: 16px;
      }

      .profile-avatar {
        width: 64px;
        height: 64px;
        font-size: 1.8rem;
      }

      .profile-info h2 {
        font-size: 1.2rem;
      }

      .account-details {
        padding: 16px 20px 24px;
      }

      .detail-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        padding: 12px 0;
      }

      .detail-row .value {
        text-align: left;
        width: 100%;
        word-break: break-all;
      }

      .action-buttons {
        grid-template-columns: 1fr;
      }

      #menuContainer .menu-panel {
        width: 280px;
        padding: 24px 18px;
      }

      .hamburger {
        top: 16px;
        left: 16px;
        padding: 10px 12px;
      }

      .hamburger span {
        width: 24px;
        height: 2px;
      }

      .page-header .back-btn {
        width: 38px;
        height: 38px;
        font-size: 0.9rem;
      }
    }

    @media (max-width: 480px) {
      .page-header h1 {
        font-size: 1.2rem;
      }

      .profile-header {
        padding: 20px 16px;
      }

      .profile-avatar {
        width: 56px;
        height: 56px;
        font-size: 1.5rem;
      }

      .account-details {
        padding: 12px 16px 20px;
      }

      .detail-row .label {
        font-size: 0.8rem;
      }

      .detail-row .value {
        font-size: 0.85rem;
      }

      .btn-action {
        font-size: 0.85rem;
        padding: 12px 16px;
      }

      #menuContainer .menu-panel {
        width: 260px;
        padding: 20px 14px;
      }
    }
  </style>
</head>
<body>

  <!-- ============================================
       PARTICLES BACKGROUND
  ============================================ -->
  <div class="particles" id="particles"></div>

  <!-- ============================================
       HAMBURGER
  ============================================ -->
  <div class="hamburger" id="hamburgerBtn" aria-label="Buka menu">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <!-- ============================================
       MENU OVERLAY
  ============================================ -->
  <div class="menu-overlay" id="menuOverlay"></div>

  <!-- ============================================
       MENU CONTAINER
  ============================================ -->
  <div id="menuContainer"></div>

  <!-- ============================================
       MAIN CONTENT
  ============================================ -->
  <div class="main-wrapper" id="mainContent">

    <!-- ===== PAGE HEADER ===== -->
    <div class="page-header">
      <a href="index.html" class="back-btn" title="Kembali ke Beranda">
        <i class="fas fa-arrow-left"></i>
      </a>
      <h1>Informasi <span>Akun</span></h1>
    </div>

    <!-- ===== ACCOUNT INFO ===== -->
    <div id="accountContent">
      <div class="loading-state">
        <i class="fas fa-spinner"></i>
        <p>Memuat informasi akun...</p>
      </div>
    </div>

  </div>

  <!-- ============================================
       FOOTER
  ============================================ -->
  <footer class="footer">
    <div class="brand">Steve<span>MC</span></div>
    <div class="copyright">
      <i class="fas fa-copyright"></i> 2026 by <i class="fas fa-code"></i> SteveMC
    </div>
  </footer>

  <script>
    // ============================================================
    // 1. SUPABASE KONFIGURASI
    // ============================================================
    const SUPABASE_URL = 'https://ydcdfnvtacwrrhcbsjdk.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_DABKAaVwkW5LvR7oP-pDNQ_9SyGiBrI';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ============================================================
    // 2. OWNER SYSTEM - KONFIGURASI
    // ============================================================
    // ===== OWNER SYSTEM =====
    const OWNER_ID = 'ce5879ba-007c-4258-acd1-75246073a151';

    // ============================================================
    // 3. OWNER SYSTEM - FUNGSI PENGECEKAN
    // ============================================================
    // ===== OWNER SYSTEM =====
    function isOwner(user) {
      if (!user || !user.id) return false;
      return user.id === OWNER_ID;
    }

    // ============================================================
    // 4. ELEMENT REFERENSI
    // ============================================================
    const accountContent = document.getElementById('accountContent');

    // ============================================================
    // 5. PARTICLES BACKGROUND
    // ============================================================
    (function createParticles() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 40; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.width = (2 + Math.random() * 4) + 'px';
        p.style.height = p.style.width;
        p.style.animationDuration = (15 + Math.random() * 25) + 's';
        p.style.animationDelay = (Math.random() * 20) + 's';
        p.style.opacity = 0.2 + Math.random() * 0.3;
        container.appendChild(p);
      }
    })();

    // ============================================================
    // 6. CEK SESSION & LOAD USER DATA
    // ============================================================
    async function loadAccountData() {
      try {
        const { data: { session }, error } = await supabaseClient.auth.getSession();

        if (error || !session) {
          window.location.replace('https://stevemc.my.id/login.html');
          return;
        }

        const user = session.user;
        const metadata = user.user_metadata || {};

        const name = metadata.full_name || metadata.name || user.email || 'User';
        const email = user.email || 'Email tidak tersedia';
        const avatar = metadata.avatar_url || metadata.picture || '';
        const provider = user.app_metadata?.provider || 'email';
        const created = user.created_at ? new Date(user.created_at).toLocaleDateString('id-ID', {
          day: 'numeric',
          month: 'long',
          year: 'numeric'
        }) : 'Tidak diketahui';
        const lastSignIn = user.last_sign_in_at ? new Date(user.last_sign_in_at).toLocaleDateString('id-ID', {
          day: 'numeric',
          month: 'long',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        }) : 'Tidak diketahui';

        // ===== OWNER SYSTEM: Cek apakah user adalah owner =====
        const isOwnerUser = isOwner(user);
        console.log('🆔 User ID:', user.id);
        console.log('👑 Status Owner:', isOwnerUser ? 'TRUE ✅' : 'FALSE ❌');

        renderAccountData({
          name,
          email,
          avatar,
          provider,
          created,
          lastSignIn,
          id: user.id,
          confirmed: user.confirmed_at ? true : false,
          isOwner: isOwnerUser
        });

      } catch (err) {
        console.error('Error loading account data:', err);
        accountContent.innerHTML = `
          <div class="account-card" style="text-align:center;padding:40px 20px;color:#ff6b6b;">
            <i class="fas fa-exclamation-circle" style="font-size:32px;display:block;margin-bottom:12px;"></i>
            <p>Gagal memuat informasi akun.</p>
            <p style="font-size:13px;color:rgba(255,255,255,0.3);margin-top:8px;">${err.message}</p>
            <a href="index.html" class="btn-action primary" style="margin-top:16px;display:inline-flex;">
              <i class="fas fa-home"></i> Kembali ke Beranda
            </a>
          </div>
        `;
      }
    }

    // ============================================================
    // 7. RENDER DATA AKUN
    // ============================================================
    function renderAccountData(data) {
      const initial = data.name.charAt(0).toUpperCase();

      // ===== OWNER SYSTEM: Tampilkan badge owner jika user adalah owner =====
      const ownerBadgeHTML = data.isOwner
        ? `<span class="owner-badge"><i class="fas fa-crown"></i> Owner</span>`
        : '';

      const roleBadgeHTML = data.isOwner
        ? `<span class="owner-role-badge"><i class="fas fa-crown"></i> Owner</span>`
        : `<span class="badge">User</span>`;

      accountContent.innerHTML = `
        <!-- Profile Card -->
        <div class="account-card">
          <div class="profile-header">
            ${data.avatar
              ? `<img class="profile-avatar" src="${data.avatar}" alt="${data.name}" />`
              : `<div class="profile-avatar">${initial}</div>`
            }
            <div class="profile-info">
              <h2>${data.name} ${ownerBadgeHTML}</h2>
              <div class="email">${data.email}</div>
              <div class="member-since">
                <i class="fas fa-calendar-alt"></i> Bergabung sejak ${data.created}
              </div>
            </div>
          </div>

          <div class="account-details">
            <div class="detail-row">
              <span class="label"><i class="fas fa-user"></i> Nama</span>
              <span class="value">${data.name}</span>
            </div>
            <div class="detail-row">
              <span class="label"><i class="fas fa-envelope"></i> Email</span>
              <span class="value">${data.email}</span>
            </div>
            <div class="detail-row">
              <span class="label"><i class="fas fa-id-card"></i> ID Akun</span>
              <span class="value" style="font-size:0.8rem;color:rgba(255,255,255,0.3);font-weight:400;">${data.id}</span>
            </div>
            <div class="detail-row">
              <span class="label"><i class="fas fa-plug"></i> Provider</span>
              <span class="value">
                ${data.provider === 'google' ? '<span class="badge"><i class="fab fa-google" style="margin-right:4px;"></i> Google</span>' :
                  data.provider === 'github' ? '<span class="badge"><i class="fab fa-github" style="margin-right:4px;"></i> GitHub</span>' :
                  data.provider === 'email' ? '<span class="badge">Email</span>' :
                  `<span class="badge">${data.provider}</span>`}
              </span>
            </div>
            <div class="detail-row">
              <span class="label"><i class="fas fa-check-circle"></i> Status</span>
              <span class="value">
                ${data.confirmed
                  ? '<span class="badge" style="background:rgba(37,211,102,0.15);color:#25D366;border-color:rgba(37,211,102,0.15);"><i class="fas fa-check" style="margin-right:4px;"></i> Terverifikasi</span>'
                  : '<span class="badge" style="background:rgba(255,200,0,0.15);color:#fbbf24;border-color:rgba(255,200,0,0.15);"><i class="fas fa-clock" style="margin-right:4px;"></i> Belum diverifikasi</span>'
                }
              </span>
            </div>
            <div class="detail-row">
              <span class="label"><i class="fas fa-clock"></i> Terakhir Login</span>
              <span class="value">${data.lastSignIn}</span>
            </div>
            <!-- ===== OWNER SYSTEM: Tampilkan role ===== -->
            <div class="detail-row">
              <span class="label"><i class="fas fa-user-tag"></i> Role</span>
              <span class="value">${roleBadgeHTML}</span>
            </div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
          <a href="index.html" class="btn-action">
            <i class="fas fa-home"></i> Beranda
          </a>
          <button class="btn-action" onclick="window.location.reload()">
            <i class="fas fa-sync"></i> Refresh
          </button>
          <button class="btn-action primary" onclick="copyUserID()">
            <i class="fas fa-copy"></i> Salin ID Akun
          </button>
          <button class="btn-action danger" id="logoutBtn">
            <i class="fas fa-sign-out-alt"></i> Logout
          </button>
        </div>
      `;

      // Event listener logout
      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await supabaseClient.auth.signOut();
        window.location.replace('https://stevemc.my.id/login.html');
      });
    }

    // ============================================================
    // 8. COPY USER ID
    // ============================================================
    function copyUserID() {
      const idElement = document.querySelector('.detail-row .value[style*="font-size:0.8rem"]');
      if (idElement) {
        const userId = idElement.textContent.trim();
        navigator.clipboard.writeText(userId).then(() => {
          const btn = document.querySelector('.btn-action.primary');
          const originalText = btn.innerHTML;
          btn.innerHTML = '<i class="fas fa-check"></i> Tersalin!';
          setTimeout(() => {
            btn.innerHTML = originalText;
          }, 2000);
        }).catch(() => {
          alert('ID Akun: ' + userId);
        });
      }
    }

    // ============================================================
    // 9. LOAD MENU - Memilih menu berdasarkan status owner
    // ============================================================
    function loadMenu() {
      const menuContainer = document.getElementById('menuContainer');
      const hamburger = document.getElementById('hamburgerBtn');
      const menuOverlay = document.getElementById('menuOverlay');

      if (!menuContainer) return;

      // ===== OWNER SYSTEM: Cek session untuk menentukan menu =====
      supabaseClient.auth.getSession().then(({ data: { session } }) => {
        const isOwnerUser = session && isOwner(session.user);
        const menuFile = isOwnerUser ? 'menu_owner.html' : 'menu.html';

        console.log(`📋 Memuat menu: ${menuFile} (${isOwnerUser ? 'Owner' : 'User'})`);

        fetch(menuFile)
          .then(res => {
            if (!res.ok) throw new Error(`Menu ${menuFile} tidak ditemukan`);
            return res.text();
          })
          .then(html => {
            menuContainer.innerHTML = html;
            const menuPanel = document.getElementById('menuPanel');
            if (!menuPanel) return;

            const currentPage = window.location.pathname.split('/').pop() || 'account.html';
            menuPanel.querySelectorAll('.menu-list a').forEach(link => {
              link.classList.remove('active');
              if (link.getAttribute('href') === currentPage) {
                link.classList.add('active');
              }
            });

            function toggleMenu(forceState) {
              const isOpen = typeof forceState === 'boolean' ? forceState : !menuPanel.classList.contains('open');
              menuPanel.classList.toggle('open', isOpen);
              menuOverlay.classList.toggle('open', isOpen);

              if (isOpen) {
                hamburger.classList.add('hidden');
              } else {
                hamburger.classList.remove('hidden');
              }

              document.body.style.overflow = isOpen ? 'hidden' : '';
            }

            const newHamburger = hamburger.cloneNode(true);
            hamburger.parentNode.replaceChild(newHamburger, hamburger);

            newHamburger.addEventListener('click', () => toggleMenu());
            menuOverlay.addEventListener('click', () => toggleMenu(false));

            document.addEventListener('keydown', (e) => {
              if (e.key === 'Escape' && menuPanel.classList.contains('open')) {
                toggleMenu(false);
              }
            });

            menuPanel.querySelectorAll('.menu-list a').forEach(link => {
              link.addEventListener('click', () => {
                if (link.getAttribute('href') !== '#') {
                  toggleMenu(false);
                }
              });
            });
          })
          .catch(err => {
            console.warn('Gagal memuat menu:', err);
            menuContainer.innerHTML = `
              <nav class="menu-panel" id="menuPanel">
                <div class="menu-header">
                  <div class="brand-icon"><i class="fas fa-download"></i></div>
                  <div class="brand-text">Media<span>Download</span></div>
                </div>
                <ul class="menu-list">
                  <li><a href="index.html"><i class="fas fa-home"></i> Beranda</a></li>
                  <li><a href="account.html" class="active"><i class="fas fa-user"></i> Akun Saya</a></li>
                </ul>
                <div class="menu-footer">
                  <i class="fas fa-code"></i> v1.0 &bull; by SteveMC
                </div>
              </nav>
            `;
            const menuPanel = document.getElementById('menuPanel');
            if (menuPanel) {
              const newHamburger = hamburger.cloneNode(true);
              hamburger.parentNode.replaceChild(newHamburger, hamburger);

              newHamburger.addEventListener('click', () => {
                menuPanel.classList.toggle('open');
                menuOverlay.classList.toggle('open');
                newHamburger.classList.toggle('hidden');
              });
              menuOverlay.addEventListener('click', () => {
                menuPanel.classList.remove('open');
                menuOverlay.classList.remove('open');
                newHamburger.classList.remove('hidden');
              });
            }
          });
      });
    }

    // ============================================================
    // 10. SUPABASE AUTH STATE CHANGE
    // ============================================================
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') {
        window.location.replace('https://stevemc.my.id/login.html');
      }
    });

    // ============================================================
    // 11. JALANKAN
    // ============================================================
    loadMenu();
    loadAccountData();

    console.log('%c👤 SteveMC Account Page', 'font-size:16px;font-weight:bold;color:#7c4dff;');
    console.log('📌 Halaman informasi akun aktif');
    console.log('👑 Owner ID:', OWNER_ID);
  </script>

</body>
</html>
