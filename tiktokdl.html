<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="theme-color" content="#0a0f23" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok Download - SteveMC</title>

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="https://c.termai.cc/i131/K4M.jpg" />

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- ===== SUPABASE JS SDK v2 ===== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- ===== AUTH CHECK MODULE ===== -->
  <script src="auth-check.js"></script>

  <style>
    /* Style dasar halaman */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #080c1a;
      color: #c8d6e5;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .page-title {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #7c4dff, #00e5ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 20px;
    }
    .content {
      background: rgba(255,255,255,0.04);
      border-radius: 20px;
      padding: 30px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .owner-badge {
      display: none;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, #ffd700, #f59e0b);
      color: #1a1a2e;
      padding: 4px 14px;
      border-radius: 60px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-left: 8px;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
    }
    .owner-badge i { font-size: 0.65rem; }
    
    /* Loading screen */
    #authLoading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #080c1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    #authLoading.hidden { opacity: 0; pointer-events: none; }
    #authLoading .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(124,77,255,0.1);
      border-top: 3px solid #7c4dff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #authLoading p { margin-top: 16px; color: rgba(255,255,255,0.4); font-size: 0.95rem; }

    /* Main content - initially hidden */
    #mainContent { display: none; }
  </style>
</head>
<body>

  <!-- ===== LOADING SCREEN ===== -->
  <div id="authLoading">
    <div class="spinner"></div>
    <p>Memeriksa session...</p>
  </div>

  <!-- ===== MAIN CONTENT ===== -->
  <div id="mainContent">
    <div class="container">
      <h1 class="page-title">
        TikTok Download
        <span class="owner-badge" id="ownerBadge"><i class="fas fa-crown"></i> Owner</span>
      </h1>
      <div class="content">
        <p>Halaman TikTok Download</p>
        <p style="color:rgba(255,255,255,0.3);margin-top:10px;">
          <i class="fas fa-lock"></i> Halaman ini dilindungi login
        </p>
        <!-- Konten TikTok Download di sini -->
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // INITIALIZE AUTH UNTUK HALAMAN INI
    // ============================================================
    (async function() {
      // Inisialisasi auth protection
      const result = await steveMC.auth.initAuthPage({
        mainContentId: 'mainContent',
        ownerBadgeId: 'ownerBadge',
        redirectUrl: 'https://stevemc.my.id/login.html'
      });

      // Jika user sudah login, tampilkan konten tambahan
      if (result.isLoggedIn) {
        console.log('✅ User sudah login, tampilkan konten TikTok Download');
        // Tambahkan konten spesifik di sini
      }
    })();
  </script>

</body>
</html>
