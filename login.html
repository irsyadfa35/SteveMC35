<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="theme-color" content="#0a0f23" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - SteveMC</title>

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="https://c.termai.cc/i131/K4M.jpg" />

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- ===== SUPABASE JS SDK v2 ===== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ============================================
       RESET & BASE
    ============================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #080c1a;
      color: #c8d6e5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      padding: 20px;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(ellipse at 20% 50%, rgba(124, 77, 255, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(0, 229, 255, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(255, 0, 80, 0.05) 0%, transparent 50%);
      z-index: 0;
      pointer-events: none;
    }

    /* Floating particles */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(167, 139, 250, 0.3);
      border-radius: 50%;
      animation: float-particle linear infinite;
    }

    @keyframes float-particle {
      0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) scale(1);
        opacity: 0;
      }
    }

    /* ============================================
       SCROLLBAR
    ============================================ */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #080c1a;
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #7c4dff, #00e5ff);
      border-radius: 10px;
    }

    /* ============================================
       LOGIN CONTAINER
    ============================================ */
    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 40px 36px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    /* Back button */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.4);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.3s ease;
      margin-bottom: 24px;
    }

    .back-btn:hover {
      color: #a78bfa;
      transform: translateX(-4px);
    }

    .back-btn i {
      font-size: 0.8rem;
    }

    /* Header */
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-header .brand-icon {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #7c4dff, #00e5ff);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #fff;
      margin: 0 auto 16px;
      box-shadow: 0 8px 30px rgba(124, 77, 255, 0.3);
    }

    .login-header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .login-header h1 span {
      background: linear-gradient(135deg, #7c4dff, #00e5ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-header p {
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.95rem;
      margin-top: 6px;
    }

    /* ===== ERROR MESSAGE ===== */
    .error-message {
      display: none;
      background: rgba(255, 0, 0, 0.1);
      border: 1px solid rgba(255, 0, 0, 0.2);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 16px;
      color: #ff6b6b;
      font-size: 0.9rem;
      text-align: center;
    }

    .error-message.show {
      display: block;
    }

    .error-message i {
      margin-right: 8px;
    }

    /* ===== SUCCESS MESSAGE ===== */
    .success-message {
      display: none;
      background: rgba(37, 211, 102, 0.1);
      border: 1px solid rgba(37, 211, 102, 0.2);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 16px;
      color: #25D366;
      font-size: 0.9rem;
      text-align: center;
    }

    .success-message.show {
      display: block;
    }

    .success-message i {
      margin-right: 8px;
    }

    /* Form */
    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 6px;
    }

    .form-group .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      transition: all 0.3s ease;
    }

    .form-group .input-wrapper:focus-within {
      border-color: rgba(124, 77, 255, 0.4);
      box-shadow: 0 0 0 3px rgba(124, 77, 255, 0.1);
    }

    .form-group .input-wrapper i {
      position: absolute;
      left: 16px;
      color: rgba(255, 255, 255, 0.2);
      font-size: 1.1rem;
      transition: color 0.3s;
    }

    .form-group .input-wrapper:focus-within i {
      color: #7c4dff;
    }

    .form-group .input-wrapper input {
      width: 100%;
      padding: 14px 16px 14px 48px;
      background: transparent;
      border: none;
      color: #c8d6e5;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
    }

    .form-group .input-wrapper input::placeholder {
      color: rgba(255, 255, 255, 0.2);
    }

    .form-group .input-wrapper .toggle-password {
      position: absolute;
      right: 16px;
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.2);
      cursor: pointer;
      font-size: 1rem;
      transition: color 0.3s;
      padding: 4px;
    }

    .form-group .input-wrapper .toggle-password:hover {
      color: rgba(255, 255, 255, 0.5);
    }

    /* Options */
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 6px 0 24px;
    }

    .form-options label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.4);
      cursor: pointer;
    }

    .form-options label input[type="checkbox"] {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      position: relative;
      transition: all 0.3s ease;
      flex-shrink: 0;
    }

    .form-options label input[type="checkbox"]:checked {
      background: linear-gradient(135deg, #7c4dff, #00e5ff);
      border-color: #7c4dff;
    }

    .form-options label input[type="checkbox"]:checked::after {
      content: '\f00c';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 10px;
      color: #fff;
    }

    .form-options a {
      color: rgba(167, 139, 250, 0.7);
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.3s;
    }

    .form-options a:hover {
      color: #a78bfa;
    }

    /* Button */
    .btn-login {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #7c4dff, #00e5ff);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      box-shadow: 0 4px 30px rgba(124, 77, 255, 0.3);
    }

    .btn-login:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 8px 50px rgba(124, 77, 255, 0.5);
    }

    .btn-login:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-login .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .btn-login.loading .spinner {
      display: block;
    }

    .btn-login.loading .btn-text {
      display: none;
    }

    .btn-login.loading .btn-icon {
      display: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 24px 0;
    }

    .divider .line {
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.06);
    }

    .divider span {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.2);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Social Login */
    .social-login {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn-social {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.03);
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      text-decoration: none;
    }

    .btn-social:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.12);
      color: #fff;
      transform: translateY(-2px);
    }

    .btn-social:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-social i {
      font-size: 1.2rem;
    }

    .btn-social .fa-google { color: #ea4335; }
    .btn-social .fa-github { color: #f0f6fc; }
    .btn-social .fa-discord { color: #5865F2; }
    .btn-social .fa-twitter { color: #1DA1F2; }

    /* Register link */
    .register-link {
      text-align: center;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.4);
    }

    .register-link a {
      color: #a78bfa;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
    }

    .register-link a:hover {
      color: #7c4dff;
      text-decoration: underline;
    }

    /* ===== TOMBOL LOGIN NANTI ===== */
    .btn-skip {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: transparent;
      color: rgba(255, 255, 255, 0.3);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      text-align: center;
      margin-top: 8px;
    }

    .btn-skip:hover {
      color: rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.03);
    }

    .btn-skip i {
      margin-right: 8px;
      font-size: 0.9rem;
    }

    /* ============================================
       RESPONSIVE
    ============================================ */
    @media (max-width: 480px) {
      .login-card {
        padding: 28px 20px;
        border-radius: 20px;
      }

      .login-header h1 {
        font-size: 1.5rem;
      }

      .login-header .brand-icon {
        width: 50px;
        height: 50px;
        font-size: 22px;
      }

      .social-login {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .btn-social {
        font-size: 0.8rem;
        padding: 10px;
      }

      .form-options {
        flex-direction: column;
        gap: 10px;
        align-items: flex-start;
      }

      .back-btn {
        font-size: 0.8rem;
      }

      .btn-skip {
        font-size: 0.85rem;
        padding: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- ============================================
       PARTICLES BACKGROUND
  ============================================ -->
  <div class="particles" id="particles"></div>

  <!-- ============================================
       LOGIN CONTAINER
  ============================================ -->
  <div class="login-container">

    <div class="login-card">

      <!-- Back Button -->
      <a href="index.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> Kembali
      </a>

      <!-- Header -->
      <div class="login-header">
        <div class="brand-icon">
          <i class="fas fa-gamepad"></i>
        </div>
        <h1>Welcome to <span>SteveMC</span></h1>
        <p>Masuk ke akun Anda untuk melanjutkan</p>
      </div>

      <!-- ===== ERROR MESSAGE ===== -->
      <div class="error-message" id="errorMessage">
        <i class="fas fa-exclamation-circle"></i>
        <span id="errorText">Terjadi kesalahan</span>
      </div>

      <!-- ===== SUCCESS MESSAGE ===== -->
      <div class="success-message" id="successMessage">
        <i class="fas fa-check-circle"></i>
        <span id="successText">Login berhasil!</span>
      </div>

      <!-- ===== FORM LOGIN ===== -->
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label>Email atau Username</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope"></i>
            <input type="text" id="emailInput" placeholder="Masukkan email atau username" required />
          </div>
        </div>

        <div class="form-group">
          <label>Kata Sandi</label>
          <div class="input-wrapper">
            <i class="fas fa-lock"></i>
            <input type="password" id="passwordInput" placeholder="Masukkan kata sandi" required />
            <button type="button" class="toggle-password" onclick="togglePassword()">
              <i class="fas fa-eye" id="toggleIcon"></i>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label>
            <input type="checkbox" id="rememberMe" /> Ingat saya
          </label>
          <a href="forgot-password.html">Lupa kata sandi?</a>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <span class="btn-icon"><i class="fas fa-sign-in-alt"></i></span>
          <span class="btn-text">Masuk</span>
          <span class="spinner"></span>
        </button>
      </form>

      <!-- Divider -->
      <div class="divider">
        <div class="line"></div>
        <span>atau</span>
        <div class="line"></div>
      </div>

      <!-- ===== SOCIAL LOGIN ===== -->
      <div class="social-login">
        <!-- GOOGLE - Terhubung dengan Supabase OAuth -->
        <button class="btn-social" id="googleLoginBtn">
          <i class="fab fa-google"></i> Google
        </button>

        <!-- GITHUB - Belum diaktifkan -->
        <button class="btn-social" id="githubLoginBtn" disabled>
          <i class="fab fa-github"></i> GitHub
        </button>

        <!-- DISCORD - Belum diaktifkan -->
        <button class="btn-social" id="discordLoginBtn" disabled>
          <i class="fab fa-discord"></i> Discord
        </button>

        <!-- TWITTER - Belum diaktifkan -->
        <button class="btn-social" id="twitterLoginBtn" disabled>
          <i class="fab fa-twitter"></i> Twitter
        </button>
      </div>

      <!-- ===== TOMBOL LOGIN NANTI ===== -->
      <button class="btn-skip" id="skipLoginBtn">
        <i class="fas fa-clock"></i> Login Nanti
      </button>

      <!-- Register Link -->
      <div class="register-link">
        Belum punya akun? <a href="register.html">Daftar sekarang</a>
      </div>

    </div>

  </div>

  <script>
    // ============================================================
    // 1. SUPABASE KONFIGURASI
    // ============================================================
    const SUPABASE_URL = 'https://ydcdfnvtacwrrhcbsjdk.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_DABKAaVwkW5LvR7oP-pDNQ_9SyGiBrI';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ============================================================
    // 2. PARTICLES BACKGROUND
    // ============================================================
    (function createParticles() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 40; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.width = (2 + Math.random() * 4) + 'px';
        p.style.height = p.style.width;
        p.style.animationDuration = (15 + Math.random() * 25) + 's';
        p.style.animationDelay = (Math.random() * 20) + 's';
        p.style.opacity = 0.2 + Math.random() * 0.3;
        container.appendChild(p);
      }
    })();

    // ============================================================
    // 3. TOGGLE PASSWORD
    // ============================================================
    function togglePassword() {
      const passwordInput = document.getElementById('passwordInput');
      const toggleIcon = document.getElementById('toggleIcon');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.className = 'fas fa-eye-slash';
      } else {
        passwordInput.type = 'password';
        toggleIcon.className = 'fas fa-eye';
      }
    }

    // ============================================================
    // 4. ELEMENT REFERENSI
    // ============================================================
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const rememberMe = document.getElementById('rememberMe');
    const errorMessage = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');
    const successMessage = document.getElementById('successMessage');
    const successText = document.getElementById('successText');
    const googleLoginBtn = document.getElementById('googleLoginBtn');
    const skipLoginBtn = document.getElementById('skipLoginBtn');

    // ============================================================
    // 5. FUNGSI UTILITY
    // ============================================================
    function showError(message) {
      errorText.textContent = message;
      errorMessage.classList.add('show');
      successMessage.classList.remove('show');
      setTimeout(() => {
        errorMessage.classList.remove('show');
      }, 5000);
    }

    function showSuccess(message) {
      successText.textContent = message;
      successMessage.classList.add('show');
      errorMessage.classList.remove('show');
      setTimeout(() => {
        successMessage.classList.remove('show');
      }, 3000);
    }

    function hideAllMessages() {
      errorMessage.classList.remove('show');
      successMessage.classList.remove('show');
    }

    function setLoading(isLoading) {
      loginBtn.disabled = isLoading;
      loginBtn.classList.toggle('loading', isLoading);
      emailInput.disabled = isLoading;
      passwordInput.disabled = isLoading;
    }

    // ============================================================
    // 6. LOGIN DENGAN EMAIL/USERNAME + PASSWORD
    // ============================================================
    async function handleLogin(e) {
      e.preventDefault();
      hideAllMessages();

      const emailOrUsername = emailInput.value.trim();
      const password = passwordInput.value;

      if (!emailOrUsername) {
        showError('Masukkan email atau username.');
        return;
      }
      if (!password) {
        showError('Masukkan kata sandi.');
        return;
      }

      setLoading(true);

      try {
        let email = emailOrUsername;

        if (!emailOrUsername.includes('@')) {
          const { data: users, error: searchError } = await supabaseClient
            .from('user_profiles')
            .select('user_id, email')
            .eq('username', emailOrUsername)
            .maybeSingle();

          if (searchError) {
            console.warn('Search error:', searchError);
          }

          if (users && users.email) {
            email = users.email;
          }
        }

        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          console.error('❌ Login error:', error);

          if (error.message.includes('Invalid login credentials')) {
            if (!emailOrUsername.includes('@')) {
              showError('Username atau password salah. Periksa kembali.');
            } else {
              showError('Email atau password salah. Periksa kembali.');
            }
          } else if (error.message.includes('Email not confirmed')) {
            showError('Email belum diverifikasi. Silakan cek email Anda.');
          } else {
            showError('Gagal login: ' + error.message);
          }
          setLoading(false);
          return;
        }

        console.log('✅ Login berhasil:', data);
        showSuccess('Login berhasil! Mengalihkan...');

        setTimeout(() => {
          window.location.href = 'https://stevemc.my.id/';
        }, 1500);

      } catch (error) {
        console.error('❌ Unexpected error:', error);
        showError('Terjadi kesalahan. Silakan coba lagi.');
        setLoading(false);
      }
    }

    // ============================================================
    // 7. GOOGLE OAUTH - LOGIN
    // ============================================================
    async function handleGoogleLogin() {
      hideAllMessages();

      try {
        console.log('🔐 Login dengan Google');

        const { data, error } = await supabaseClient.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: 'https://stevemc.my.id/',
            queryParams: {
              access_type: 'offline',
              prompt: 'consent',
            }
          }
        });

        if (error) {
          console.error('❌ Google OAuth error:', error);
          showError('Gagal login dengan Google: ' + error.message);
          return;
        }

        console.log('✅ Redirect ke Google OAuth...');

      } catch (error) {
        console.error('❌ Unexpected Google OAuth error:', error);
        showError('Terjadi kesalahan saat login dengan Google.');
      }
    }

    // ============================================================
    // 8. LOGIN NANTI - SKIP LOGIN (DENGAN SESSION STORAGE)
    // ============================================================
    function handleSkipLogin() {
      console.log('⏭️ User memilih "Login Nanti"');
      
      // ===== PERBAIKAN: Simpan flag ke sessionStorage =====
      sessionStorage.setItem('skipLogin', 'true');
      
      // Redirect ke beranda
      window.location.href = 'https://stevemc.my.id/';
    }

    // ============================================================
    // 9. EVENT LISTENERS
    // ============================================================

    loginForm.addEventListener('submit', handleLogin);
    googleLoginBtn.addEventListener('click', handleGoogleLogin);
    skipLoginBtn.addEventListener('click', handleSkipLogin);

    loginForm.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleLogin(e);
      }
    });

    // ============================================================
    // 10. CEK SESSION - Jika sudah login, redirect ke beranda
    // ============================================================
    (async function checkSession() {
      try {
        const { data: { session }, error } = await supabaseClient.auth.getSession();

        if (error) {
          console.warn('Error checking session:', error);
          return;
        }

        if (session) {
          console.log('✅ User sudah login, redirect ke beranda');
          window.location.href = 'https://stevemc.my.id/';
        }

      } catch (err) {
        console.error('Error checking session:', err);
      }
    })();

    // ============================================================
    // 11. SUPABASE AUTH STATE CHANGE
    // ============================================================
    supabaseClient.auth.onAuthStateChange((event, session) => {
      console.log('🔐 Auth state changed:', event);

      if (event === 'SIGNED_IN' && session) {
        console.log('✅ User signed in, redirecting...');
        window.location.href = 'https://stevemc.my.id/';
      }

      if (event === 'PASSWORD_RECOVERY') {
        console.log('🔑 Password recovery mode');
        window.location.href = 'https://stevemc.my.id/reset-password.html';
      }
    });

    console.log('%c🔐 Login Page Ready!', 'font-size:16px;font-weight:bold;color:#7c4dff;');
    console.log('📌 Supabase URL:', SUPABASE_URL);
    console.log('📌 Klik "Login Nanti" untuk melewati login');
  </script>

</body>
