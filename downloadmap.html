<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Download Map City</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ── Reset & Base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0f1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 820px;
        }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 30px;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.6);
            font-size: 20px;
            text-decoration: none;
            transition: all 0.3s ease;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            transform: translateX(-3px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .back-btn:active {
            transform: scale(0.92);
        }

        .header-content {
            flex: 1;
            text-align: center;
        }

        .header-content h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #00e5ff, #7c4dff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-content p {
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
            font-size: 14px;
        }

        /* ── Slider Gambar (tanpa autoplay) ── */
        .slider-container {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
            background: #111;
            aspect-ratio: 16 / 9;
        }

        .slider-wrapper {
            display: flex;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            height: 100%;
        }

        .slider-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border: none;
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slider-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .slider-btn.prev {
            left: 12px;
        }
        .slider-btn.next {
            right: 12px;
        }

        .slider-dots {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .slider-dots span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .slider-dots span.active {
            background: #7c4dff;
            box-shadow: 0 0 12px rgba(124, 77, 255, 0.5);
            width: 28px;
            border-radius: 6px;
        }

        /* ── Card Info ── */
        .info-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 24px 28px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 20px;
        }

        .info-card .version {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
        }

        .info-card .version strong {
            color: #00e5ff;
        }

        .info-card .update {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 2px;
        }

        .info-card .update strong {
            color: #7c4dff;
        }

        .info-card .admins {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
        }

        .info-card .admins span {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .info-card .admins span i {
            color: #ff6b8a;
            margin-right: 6px;
        }

        /* ── Tombol Download ── */
        .download-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 16px;
        }

        .btn-download {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 20px;
            border-radius: 16px;
            border: none;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #fff;
            font-family: inherit;
        }

        .btn-download.java {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #1a1a2e;
            box-shadow: 0 4px 20px rgba(247, 151, 30, 0.3);
        }

        .btn-download.java:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(247, 151, 30, 0.5);
        }

        .btn-download.bedrock {
            background: linear-gradient(135deg, #00b4db, #0083b0);
            box-shadow: 0 4px 20px rgba(0, 180, 219, 0.3);
        }

        .btn-download.bedrock:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 180, 219, 0.5);
        }

        .btn-download i {
            font-size: 18px;
        }

        /* ── WhatsApp Links ── */
        .whatsapp-section {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .whatsapp-section .label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 10px;
        }

        .whatsapp-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .whatsapp-links a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 12px;
            background: rgba(37, 211, 102, 0.15);
            color: #25D366;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid rgba(37, 211, 102, 0.1);
        }

        .whatsapp-links a:hover {
            background: rgba(37, 211, 102, 0.25);
            transform: translateY(-2px);
        }

        .whatsapp-links a i {
            font-size: 16px;
        }

        /* ── Loading ── */
        .loading-state {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255, 255, 255, 0.3);
        }

        .loading-state i {
            font-size: 40px;
            margin-bottom: 12px;
            display: block;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── Responsive ── */
        @media (max-width: 640px) {
            body {
                padding: 16px;
            }
            .header {
                flex-wrap: wrap;
                gap: 10px;
            }
            .header-content h1 {
                font-size: 22px;
            }
            .header-content {
                text-align: left;
            }
            .back-btn {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
            .download-grid {
                grid-template-columns: 1fr;
            }
            .info-card {
                padding: 18px 16px;
            }
            .slider-btn {
                width: 36px;
                height: 36px;
                font-size: 14px;
            }
            .slider-btn.prev {
                left: 8px;
            }
            .slider-btn.next {
                right: 8px;
            }
            .whatsapp-links {
                flex-direction: column;
            }
            .whatsapp-links a {
                justify-content: center;
            }
        }

        @media (max-width: 420px) {
            .header-content h1 {
                font-size: 18px;
            }
            .btn-download {
                font-size: 13px;
                padding: 14px 16px;
            }
            .back-btn {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ─── HEADER ─── -->
        <div class="header">
            <a href="index.html" class="back-btn" title="Kembali ke beranda">
                <i class="fas fa-arrow-left"></i>
            </a>
            <div class="header-content">
                <h1><i class="fas fa-map"></i> Map City</h1>
                <p>Minecraft City Map</p>
            </div>
        </div>

        <!-- ─── SLIDER GAMBAR (tanpa autoplay) ─── -->
        <div class="slider-container" id="sliderContainer">
            <div class="slider-wrapper" id="sliderWrapper">
                <img src="https://c.termai.cc/i117/hRzmq6.jpg" alt="City Map 1" loading="lazy" />
                <img src="https://c.termai.cc/i139/q87R.jpg" alt="City Map 2" loading="lazy" />
                <img src="https://c.termai.cc/i111/3p9JaW.jpg" alt="City Map 3" loading="lazy" />
                <img src="https://c.termai.cc/i107/X0t9.jpg" alt="City Map 4" loading="lazy" />
            </div>

            <button class="slider-btn prev" id="prevBtn" aria-label="Sebelumnya">
                <i class="fas fa-chevron-left"></i>
            </button>
            <button class="slider-btn next" id="nextBtn" aria-label="Berikutnya">
                <i class="fas fa-chevron-right"></i>
            </button>

            <div class="slider-dots" id="sliderDots"></div>
        </div>

        <!-- ─── AREA DATA (akan diisi dari API) ─── -->
        <div id="dataArea">
            <div class="loading-state">
                <i class="fas fa-spinner"></i>
                <p>Memuat data map...</p>
            </div>
        </div>

    </div>

    <script>
        // ─────────────────────────────────────────────
        //  SLIDER (tanpa autoplay)
        // ─────────────────────────────────────────────
        const wrapper = document.getElementById('sliderWrapper');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const dotsContainer = document.getElementById('sliderDots');

        const totalSlides = wrapper.children.length;
        let currentIndex = 0;

        // Buat dot indikator
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('span');
            dot.dataset.index = i;
            if (i === 0) dot.classList.add('active');
            dot.addEventListener('click', () => goToSlide(i));
            dotsContainer.appendChild(dot);
        }

        const dots = dotsContainer.querySelectorAll('span');

        function goToSlide(index) {
            if (index < 0) index = totalSlides - 1;
            if (index >= totalSlides) index = 0;
            currentIndex = index;
            wrapper.style.transform = `translateX(-${currentIndex * 100}%)`;

            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === currentIndex);
            });
        }

        function nextSlide() {
            goToSlide(currentIndex + 1);
        }

        function prevSlide() {
            goToSlide(currentIndex - 1);
        }

        prevBtn.addEventListener('click', prevSlide);
        nextBtn.addEventListener('click', nextSlide);

        // Geser dengan sentuhan (mobile)
        let touchStartX = 0;
        let touchEndX = 0;

        const sliderContainer = document.getElementById('sliderContainer');
        sliderContainer.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        sliderContainer.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    nextSlide();
                } else {
                    prevSlide();
                }
            }
        }, { passive: true });

        // ─────────────────────────────────────────────
        //  FETCH DATA DARI API
        // ─────────────────────────────────────────────
        const dataArea = document.getElementById('dataArea');

        async function fetchData() {
            try {
                const response = await fetch('https://endernet.web.id/bagian1?api=maptambakudangdanikan');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();

                if (!data.status || !data.datany) {
                    throw new Error('Data tidak ditemukan');
                }

                renderData(data.datany);

            } catch (error) {
                console.error('Gagal memuat data:', error);
                dataArea.innerHTML = `
                    <div class="info-card" style="text-align:center;color:#ff6b6b;">
                        <i class="fas fa-exclamation-circle" style="font-size:28px;display:block;margin-bottom:10px;"></i>
                        <p>Gagal memuat data map. Silakan refresh halaman.</p>
                        <p style="font-size:13px;color:rgba(255,255,255,0.3);margin-top:8px;">${error.message}</p>
                    </div>
                `;
            }
        }

        function renderData(datany) {
            const version = datany.version || '—';
            const update = datany.update || '—';
            const mapJava = datany.mapTambakJava || '#';
            const mapBedrock = datany.mapTambakBedrock || '#';

            const admin1 = datany.admin?.no1 || '—';
            const admin2 = datany.admin?.no2 || '—';
            const admin3 = datany.admin?.no3 || '—';

            const channel = datany.WhatsApp?.linkChannel || '#';
            const waJava = datany.WhatsApp?.linkWAgcJava || '#';
            const waBedrock = datany.WhatsApp?.linkWAgcBedrock || '#';

            dataArea.innerHTML = `
                <!-- ─── INFO CARD ─── -->
                <div class="info-card">
                    <div class="version">
                        <i class="fas fa-tag"></i> Versi: <strong>${version}</strong>
                    </div>
                    <div class="update">
                        <i class="fas fa-calendar-alt"></i> Update: <strong>${update}</strong>
                    </div>
                    <div class="admins">
                        <span><i class="fas fa-user-cog"></i> Admin: ${admin1}</span>
                        <span><i class="fas fa-user-cog"></i> ${admin2}</span>
                        <span><i class="fas fa-user-cog"></i> ${admin3}</span>
                    </div>
                </div>

                <!-- ─── TOMBOL DOWNLOAD ─── -->
                <div class="info-card">
                    <div style="font-size:14px;color:rgba(255,255,255,0.4);margin-bottom:12px;">
                        <i class="fas fa-download"></i> Pilih versi map yang ingin diunduh:
                    </div>
                    <div class="download-grid">
                        <a href="${mapJava}" target="_blank" class="btn-download java" download>
                            <i class="fab fa-java"></i> Download Java
                        </a>
                        <a href="${mapBedrock}" target="_blank" class="btn-download bedrock" download>
                            <i class="fas fa-cube"></i> Download Bedrock
                        </a>
                    </div>
                </div>

                <!-- ─── WHATSAPP LINKS ─── -->
                <div class="info-card">
                    <div class="whatsapp-section">
                        <div class="label"><i class="fab fa-whatsapp"></i> Bergabung dengan komunitas:</div>
                        <div class="whatsapp-links">
                            <a href="${channel}" target="_blank">
                                <i class="fas fa-broadcast"></i> Channel WhatsApp
                            </a>
                            <a href="${waJava}" target="_blank">
                                <i class="fab fa-java"></i> Grup Java
                            </a>
                            <a href="${waBedrock}" target="_blank">
                                <i class="fas fa-cube"></i> Grup Bedrock
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }

        // ─── JALANKAN ───
        fetchData();
    </script>

</body>
</html>
