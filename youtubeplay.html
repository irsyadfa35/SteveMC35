<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Play - Cari & Download MP3</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ── Reset & Base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 820px;
            background: #181818;
            border-radius: 32px;
            padding: 40px 36px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            position: relative;
            z-index: 1;
        }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 32px;
        }

        .menu-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.6);
            font-size: 22px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .menu-toggle:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.15);
        }

        .menu-toggle:active {
            transform: scale(0.92);
        }

        .header-icon {
            width: 52px;
            height: 52px;
            background: #FF0000;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #fff;
            box-shadow: 0 8px 24px rgba(255, 0, 0, 0.35);
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.3px;
            line-height: 1.2;
        }

        .header h1 span {
            color: #FF0000;
        }

        .header .sub {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 400;
            margin-top: 2px;
        }

        /* ── MENU PANEL (sidebar) ── */
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .menu-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .menu-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100%;
            background: #1e1e1e;
            z-index: 1000;
            padding: 24px 20px;
            box-shadow: 4px 0 30px rgba(0, 0, 0, 0.6);
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .menu-panel.open {
            transform: translateX(0);
        }

        .menu-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 20px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #FF0000, #cc0000);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 20px;
        }

        .brand-text {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }

        .brand-text span {
            color: #FF0000;
        }

        .menu-list {
            list-style: none;
            flex: 1;
            padding: 0;
        }

        .menu-list li {
            margin-bottom: 8px;
        }

        .menu-list li a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            transition: all 0.2s ease;
            font-size: 15px;
            font-weight: 500;
        }

        .menu-list li a i {
            width: 22px;
            font-size: 18px;
            text-align: center;
        }

        .menu-list li a:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }

        .menu-list li a.active {
            background: rgba(255, 0, 0, 0.15);
            color: #FF0000;
        }

        .menu-footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 13px;
            color: rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .menu-footer i {
            font-size: 14px;
        }

        /* ── Input ── */
        .input-section {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .input-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .input-wrapper input {
            flex: 1;
            min-width: 180px;
            padding: 16px 20px;
            border-radius: 16px;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .input-wrapper input:focus {
            border-color: #FF0000;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(255, 0, 0, 0.15);
        }

        .input-wrapper input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-paste {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 16px;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.5);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .btn-paste:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .btn-paste:active {
            transform: scale(0.92);
        }

        .btn-paste:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-paste.pasted {
            color: #FF0000;
            border-color: #FF0000;
            background: rgba(255, 0, 0, 0.1);
        }

        .btn-convert {
            padding: 16px 32px;
            border-radius: 16px;
            border: none;
            background: #FF0000;
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
            font-family: inherit;
            box-shadow: 0 4px 20px rgba(255, 0, 0, 0.3);
            flex-shrink: 0;
        }

        .btn-convert:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 0, 0, 0.45);
            background: #cc0000;
        }

        .btn-convert:active:not(:disabled) {
            transform: scale(0.97);
        }

        .btn-convert:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-convert .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .btn-convert.loading .spinner {
            display: block;
        }
        .btn-convert.loading .btn-text {
            display: none;
        }
        .btn-convert.loading .btn-icon {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── Error ── */
        .error-msg {
            display: none;
            margin-top: 12px;
            padding: 14px 18px;
            background: rgba(255, 0, 0, 0.12);
            border-left: 4px solid #ff0000;
            border-radius: 12px;
            color: #ff6b6b;
            font-size: 14px;
            align-items: center;
            gap: 10px;
        }

        .error-msg.show {
            display: flex;
        }

        .error-msg i {
            font-size: 18px;
        }

        /* ── Result ── */
        .result-section {
            display: none;
            margin-top: 32px;
            animation: fadeUp 0.5s ease forwards;
        }

        .result-section.show {
            display: block;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        .result-thumbnail {
            flex-shrink: 0;
            width: 160px;
            height: 160px;
            border-radius: 16px;
            overflow: hidden;
            background: #282828;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .result-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .result-thumbnail .play-badge {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .result-thumbnail .play-badge i {
            font-size: 10px;
        }

        .result-info {
            flex: 1;
            min-width: 0;
        }

        .result-title {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .result-channel {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .result-channel a {
            color: #FF0000;
            text-decoration: none;
            transition: color 0.2s;
        }

        .result-channel a:hover {
            color: #ff4444;
            text-decoration: underline;
        }

        .result-description {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .result-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 24px;
            margin-top: 8px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .result-meta .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
        }

        .result-meta .meta-item i {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.3);
        }

        .result-meta .meta-item strong {
            color: #fff;
            font-weight: 500;
        }

        /* ── Audio Player ── */
        .audio-player-wrapper {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            width: 100%;
        }

        .audio-player-wrapper audio {
            width: 100%;
            height: 48px;
            border-radius: 12px;
            background: #282828;
            outline: none;
        }

        .audio-player-wrapper audio::-webkit-media-controls-panel {
            background: #282828;
        }

        .audio-player-wrapper audio::-webkit-media-controls-current-time-display,
        .audio-player-wrapper audio::-webkit-media-controls-time-remaining-display {
            color: #fff;
        }

        /* ── Download Row ── */
        .download-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .btn-download {
            flex: 1;
            min-width: 140px;
            padding: 14px 24px;
            border-radius: 14px;
            border: none;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: inherit;
        }

        .btn-download.mp3 {
            background: #FF0000;
            color: #fff;
            box-shadow: 0 4px 20px rgba(255, 0, 0, 0.3);
        }

        .btn-download.mp3:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 0, 0, 0.45);
            background: #cc0000;
        }

        .btn-download.mp3:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-download.secondary {
            background: rgba(255, 255, 255, 0.06);
            box-shadow: none;
            color: rgba(255, 255, 255, 0.7);
        }

        .btn-download.secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            box-shadow: none;
            color: #fff;
        }

        .btn-download:active:not(:disabled) {
            transform: scale(0.97);
        }

        .btn-download .spinner-small {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .btn-download.loading .spinner-small {
            display: block;
        }
        .btn-download.loading .btn-text {
            display: none;
        }
        .btn-download.loading .btn-icon {
            display: none;
        }

        /* ── Empty State ── */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            text-align: center;
            color: rgba(255, 255, 255, 0.25);
        }

        .empty-state i {
            font-size: 56px;
            margin-bottom: 16px;
            color: rgba(255, 255, 255, 0.08);
        }

        .empty-state p {
            font-size: 15px;
            max-width: 320px;
            line-height: 1.6;
        }

        /* ── Responsive ── */
        @media (max-width: 640px) {
            .container {
                padding: 24px 18px;
                border-radius: 24px;
            }
            .header {
                flex-wrap: wrap;
                gap: 10px;
            }
            .menu-toggle {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
            .header-icon {
                width: 44px;
                height: 44px;
                font-size: 20px;
            }
            .header h1 {
                font-size: 20px;
            }
            .input-wrapper input {
                padding: 14px 16px;
                font-size: 14px;
                min-width: 140px;
            }
            .btn-paste {
                width: 48px;
                height: 48px;
                font-size: 18px;
            }
            .btn-convert {
                padding: 14px 22px;
                font-size: 14px;
                width: 100%;
                justify-content: center;
            }
            .result-card {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .result-thumbnail {
                width: 140px;
                height: 140px;
            }
            .result-title {
                font-size: 18px;
            }
            .result-meta {
                justify-content: center;
            }
            .download-row {
                flex-direction: column;
            }
            .btn-download {
                width: 100%;
            }
            .audio-player-wrapper audio {
                height: 42px;
            }
            .menu-panel {
                width: 260px;
            }
        }

        @media (max-width: 420px) {
            .container {
                padding: 16px 12px;
            }
            .header h1 {
                font-size: 17px;
            }
            .header .sub {
                font-size: 12px;
            }
            .menu-toggle {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
            .btn-paste {
                width: 42px;
                height: 42px;
                font-size: 16px;
            }
            .result-thumbnail {
                width: 120px;
                height: 120px;
            }
            .menu-panel {
                width: 240px;
                padding: 20px 16px;
            }
        }
    </style>
</head>
<body>

    <!-- ─── OVERLAY ─── -->
    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- ─── CONTAINER UNTUK MENU ─── -->
    <div id="menuContainer"></div>

    <div class="container">

        <!-- ─── HEADER ─── -->
        <div class="header">
            <button class="menu-toggle" id="menuToggle" title="Buka menu">
                <i class="fas fa-bars"></i>
            </button>
            <div class="header-icon">
                <i class="fab fa-youtube"></i>
            </div>
            <div>
                <h1>YouTube <span>Play</span></h1>
                <div class="sub">Cari lagu, preview, unduh MP3</div>
            </div>
        </div>

        <!-- ─── INPUT ─── -->
        <div class="input-section">
            <div class="input-wrapper">
                <input
                type="text"
                id="searchInput"
                placeholder="Cari judul lagu atau artis... (contoh: Always Forever)"
                autocomplete="off"
                spellcheck="false"
                />
                <button class="btn-paste" id="pasteBtn" title="Tempel dari clipboard">
                    <i class="fas fa-paste"></i>
                </button>
                <button class="btn-convert" id="searchBtn">
                    <span class="btn-icon"><i class="fas fa-search"></i></span>
                    <span class="btn-text">Cari & Play</span>
                    <span class="spinner"></span>
                </button>
            </div>

            <div class="error-msg" id="errorMsg">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText">Terjadi kesalahan, silakan coba lagi.</span>
            </div>
        </div>

        <!-- ─── RESULT ─── -->
        <div class="result-section" id="resultSection">
            <div class="result-card">
                <div class="result-thumbnail" id="thumbnailContainer">
                    <img id="thumbnailImg" src="" alt="Thumbnail" />
                    <div class="play-badge" id="durationBadge">
                        <i class="fas fa-play"></i> <span id="durationBadgeText">—</span>
                    </div>
                </div>
                <div class="result-info">
                    <div class="result-title" id="resultTitle">—</div>
                    <div class="result-channel" id="resultChannel">
                        <i class="fas fa-user"></i>
                        <a href="#" id="channelLink" target="_blank">—</a>
                    </div>
                    <div class="result-description" id="resultDescription">—</div>
                    <div class="result-meta">
                        <span class="meta-item"><i class="fas fa-eye"></i> <strong id="metaViews">—</strong></span>
                        <span class="meta-item"><i class="fas fa-clock"></i> <strong id="metaDuration">—</strong></span>
                        <span class="meta-item"><i class="fas fa-calendar-alt"></i> <strong id="metaUpload">—</strong></span>
                    </div>

                    <!-- Audio Player Preview -->
                    <div class="audio-player-wrapper">
                        <audio id="audioPlayer" controls preload="metadata">
                            <source id="audioSource" src="" type="audio/mpeg" />
                            Browser Anda tidak mendukung pemutar audio.
                        </audio>
                    </div>

                    <div class="download-row">
                        <button class="btn-download mp3" id="downloadBtn">
                            <span class="btn-icon"><i class="fas fa-download"></i></span>
                            <span class="btn-text">Download MP3</span>
                            <span class="spinner-small"></span>
                        </button>
                        <button class="btn-download secondary" id="copyLinkBtn">
                            <i class="fas fa-copy"></i> Salin Link YouTube
                        </button>
                        <button class="btn-download secondary" id="openYoutubeBtn">
                            <i class="fab fa-youtube"></i> Buka di YouTube
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ─── EMPTY STATE ─── -->
        <div class="empty-state" id="emptyState">
            <i class="fas fa-music"></i>
            <p>Masukkan judul lagu atau nama artis di atas, lalu klik <strong>Cari & Play</strong> untuk mendengarkan dan mengunduh.</p>
        </div>

    </div>

    <script>
        // ─── DOM refs ──────────────────────────────────────────────
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const pasteBtn = document.getElementById('pasteBtn');
        const errorMsg = document.getElementById('errorMsg');
        const errorText = document.getElementById('errorText');
        const resultSection = document.getElementById('resultSection');
        const emptyState = document.getElementById('emptyState');

        const thumbnailImg = document.getElementById('thumbnailImg');
        const durationBadgeText = document.getElementById('durationBadgeText');
        const resultTitle = document.getElementById('resultTitle');
        const channelLink = document.getElementById('channelLink');
        const resultDescription = document.getElementById('resultDescription');
        const metaViews = document.getElementById('metaViews');
        const metaDuration = document.getElementById('metaDuration');
        const metaUpload = document.getElementById('metaUpload');
        const downloadBtn = document.getElementById('downloadBtn');
        const copyLinkBtn = document.getElementById('copyLinkBtn');
        const openYoutubeBtn = document.getElementById('openYoutubeBtn');
        const audioPlayer = document.getElementById('audioPlayer');
        const audioSource = document.getElementById('audioSource');

        // ─── State ──────────────────────────────────────────────────
        let currentDownloadUrl = '';
        let currentTitle = '';
        let currentChannel = '';
        let currentYoutubeUrl = '';

        // ─── Load Menu ─────────────────────────────────────────────
        const menuContainer = document.getElementById('menuContainer');
        const menuToggle = document.getElementById('menuToggle');
        const menuOverlay = document.getElementById('menuOverlay');

        fetch('menu.html')
            .then(res => {
                if (!res.ok) throw new Error('Menu tidak ditemukan');
                return res.text();
            })
            .then(html => {
                menuContainer.innerHTML = html;
                const menuPanel = document.getElementById('menuPanel');
                if (!menuPanel) return;

                function toggleMenu() {
                    menuPanel.classList.toggle('open');
                    menuOverlay.classList.toggle('active');
                    document.body.style.overflow = menuPanel.classList.contains('open') ? 'hidden' : '';
                }

                function closeMenu() {
                    menuPanel.classList.remove('open');
                    menuOverlay.classList.remove('active');
                    document.body.style.overflow = '';
                }

                if (menuToggle) menuToggle.addEventListener('click', toggleMenu);
                if (menuOverlay) menuOverlay.addEventListener('click', closeMenu);
            })
            .catch(err => {
                console.warn('Gagal memuat menu:', err);
                menuContainer.innerHTML = '<p style="color:rgba(255,255,255,0.3);padding:12px;">Menu tidak tersedia</p>';
            });

        // ─── Helpers ────────────────────────────────────────────────
        function showError(msg) {
            errorText.textContent = msg || 'Terjadi kesalahan.';
            errorMsg.classList.add('show');
        }

        function hideError() {
            errorMsg.classList.remove('show');
        }

        function setLoading(isLoading) {
            searchBtn.disabled = isLoading;
            searchInput.disabled = isLoading;
            pasteBtn.disabled = isLoading;
            if (isLoading) {
                searchBtn.classList.add('loading');
            } else {
                searchBtn.classList.remove('loading');
            }
        }

        function setDownloadLoading(isLoading) {
            if (isLoading) {
                downloadBtn.classList.add('loading');
                downloadBtn.disabled = true;
            } else {
                downloadBtn.classList.remove('loading');
                downloadBtn.disabled = false;
            }
        }

        function formatViews(views) {
            if (!views) return '—';
            if (typeof views === 'string') return views;
            return views.toString();
        }

        // ─── API call ──────────────────────────────────────────────
        async function fetchYtPlay(query) {
            const encoded = encodeURIComponent(query.trim());
            const apiUrl = `https://api.nexray.eu.cc/downloader/ytplay?q=${encoded}`;
            const resp = await fetch(apiUrl);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            if (!data.status) throw new Error(data.message || 'API mengembalikan status false.');
            if (!data.result || !data.result.download_url) {
                throw new Error('Tidak ada hasil untuk pencarian ini.');
            }
            return data;
        }

        function renderResult(data) {
            const r = data.result;
            currentDownloadUrl = r.download_url || '';
            currentTitle = r.title || 'Unknown Title';
            currentChannel = r.channel || 'Unknown Channel';
            currentYoutubeUrl = r.url || '';

            // Thumbnail
            if (r.thumbnail) {
                thumbnailImg.src = r.thumbnail;
                thumbnailImg.alt = r.title || 'Thumbnail';
            } else {
                thumbnailImg.src = '';
                thumbnailImg.alt = 'No thumbnail';
            }

            // Duration badge
            durationBadgeText.textContent = r.duration || '—';

            // Info
            resultTitle.textContent = r.title || '—';
            channelLink.textContent = r.channel || '—';
            channelLink.href = r.channel_url || '#';
            resultDescription.textContent = r.description || '—';

            // Meta
            metaViews.textContent = formatViews(r.views);
            metaDuration.textContent = r.duration || '—';
            metaUpload.textContent = r.upload_at || '—';

            // Set audio player
            if (currentDownloadUrl) {
                audioSource.src = currentDownloadUrl;
                audioPlayer.load();
                audioPlayer.style.display = 'block';
                downloadBtn.disabled = false;
            } else {
                audioPlayer.style.display = 'none';
                downloadBtn.disabled = true;
            }

            resultSection.classList.add('show');
            emptyState.style.display = 'none';
        }

        // ─── Download handler ──────────────────────────────────────
        async function downloadFile(url, filename, buttonElement) {
            if (!url) {
                showError('Tidak ada URL untuk diunduh.');
                return;
            }
            try {
                setDownloadLoading(true);
                const resp = await fetch(url);
                if (!resp.ok) throw new Error('Gagal mengunduh file');
                const blob = await resp.blob();
                const finalName = filename.endsWith('.mp3') ? filename : `${filename}.mp3`;

                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = finalName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(link.href), 5000);

            } catch (err) {
                try {
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = filename.endsWith('.mp3') ? filename : `${filename}.mp3`;
                    link.target = '_blank';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                } catch (_) {
                    showError('Gagal mengunduh. Coba klik kanan dan "Save link as..."');
                }
            } finally {
                setDownloadLoading(false);
            }
        }

        // ─── Paste ──────────────────────────────────────────────────
        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    searchInput.value = text;
                    searchInput.focus();
                    pasteBtn.classList.add('pasted');
                    setTimeout(() => pasteBtn.classList.remove('pasted'), 1500);
                } else {
                    showError('Clipboard kosong.');
                }
            } catch (_) {
                const text = prompt('Tidak dapat mengakses clipboard. Silakan tempel teks secara manual:', '');
                if (text !== null && text.trim() !== '') {
                    searchInput.value = text.trim();
                    searchInput.focus();
                }
            }
        }

        // ─── Search ─────────────────────────────────────────────────
        async function handleSearch() {
            const raw = searchInput.value.trim();
            if (!raw) {
                showError('Silakan masukkan judul lagu atau nama artis.');
                return;
            }

            hideError();
            setLoading(true);
            resultSection.classList.remove('show');
            emptyState.style.display = 'flex';
            audioPlayer.pause();
            audioSource.src = '';
            audioPlayer.load();

            try {
                const data = await fetchYtPlay(raw);
                renderResult(data);
                hideError();
            } catch (err) {
                console.error(err);
                showError(err.message || 'Gagal mencari lagu. Periksa kata kunci dan coba lagi.');
                resultSection.classList.remove('show');
                emptyState.style.display = 'flex';
            } finally {
                setLoading(false);
            }
        }

        // ─── Event listeners ────────────────────────────────────────
        searchBtn.addEventListener('click', handleSearch);
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleSearch();
            }
        });
        pasteBtn.addEventListener('click', pasteFromClipboard);

        downloadBtn.addEventListener('click', () => {
            if (!currentDownloadUrl) {
                showError('Tidak ada audio untuk diunduh.');
                return;
            }
            const name = `${currentTitle} - ${currentChannel}`.replace(/[^a-zA-Z0-9 ]/g, '').trim() || 'youtube_audio';
            downloadFile(currentDownloadUrl, name, downloadBtn);
        });

        copyLinkBtn.addEventListener('click', () => {
            if (!currentYoutubeUrl) {
                showError('Tidak ada link YouTube untuk disalin.');
                return;
            }
            navigator.clipboard.writeText(currentYoutubeUrl)
                .then(() => {
                    const orig = copyLinkBtn.innerHTML;
                    copyLinkBtn.innerHTML = '<i class="fas fa-check"></i> Tersalin!';
                    setTimeout(() => { copyLinkBtn.innerHTML = orig; }, 2000);
                })
                .catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = currentYoutubeUrl;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    const orig = copyLinkBtn.innerHTML;
                    copyLinkBtn.innerHTML = '<i class="fas fa-check"></i> Tersalin!';
                    setTimeout(() => { copyLinkBtn.innerHTML = orig; }, 2000);
                });
        });

        openYoutubeBtn.addEventListener('click', () => {
            if (!currentYoutubeUrl) {
                showError('Tidak ada link YouTube untuk dibuka.');
                return;
            }
            window.open(currentYoutubeUrl, '_blank');
        });

        // ─── Init ────────────────────────────────────────────────────
        emptyState.style.display = 'flex';
        resultSection.classList.remove('show');
        hideError();
        downloadBtn.disabled = true;
        audioPlayer.style.display = 'none';
    </script>

</body>
</html>
