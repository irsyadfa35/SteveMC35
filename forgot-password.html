<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="theme-color" content="#0a0f23" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lupa Password - SteveMC</title>

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="https://c.termai.cc/i131/K4M.jpg" />

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- ===== SUPABASE JS SDK v2 ===== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ============================================
       RESET & BASE
    ============================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #080c1a;
      color: #c8d6e5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      padding: 20px;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(ellipse at 20% 50%, rgba(124, 77, 255, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(0, 229, 255, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(255, 0, 80, 0.05) 0%, transparent 50%);
      z-index: 0;
      pointer-events: none;
    }

    /* Floating particles */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(167, 139, 250, 0.3);
      border-radius: 50%;
      animation: float-particle linear infinite;
    }

    @keyframes float-particle {
      0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) scale(1);
        opacity: 0;
      }
    }

    /* ============================================
       SCROLLBAR
    ============================================ */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #080c1a;
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #7c4dff, #00e5ff);
      border-radius: 10px;
    }

    /* ============================================
       CONTAINER
    ============================================ */
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
    }

    .card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 40px 36px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    /* Back button */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.4);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.3s ease;
      margin-bottom: 24px;
    }

    .back-btn:hover {
      color: #a78bfa;
      transform: translateX(-4px);
    }

    .back-btn i {
      font-size: 0.8rem;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header .icon {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #f59e0b, #fbbf24);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #1a1a2e;
      margin: 0 auto 16px;
      box-shadow: 0 8px 30px rgba(245, 158, 11, 0.3);
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .header h1 span {
      background: linear-gradient(135deg, #f59e0b, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.95rem;
      margin-top: 6px;
    }

    /* ===== MESSAGES ===== */
    .message {
      display: none;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      text-align: center;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: rgba(255, 0, 0, 0.1);
      border: 1px solid rgba(255, 0, 0, 0.2);
      color: #ff6b6b;
    }

    .message.success {
      background: rgba(37, 211, 102, 0.1);
      border: 1px solid rgba(37, 211, 102, 0.2);
      color: #25D366;
    }

    .message i {
      margin-right: 8px;
    }

    /* Form */
    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 6px;
    }

    .form-group .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      transition: all 0.3s ease;
    }

    .form-group .input-wrapper:focus-within {
      border-color: rgba(245, 158, 11, 0.4);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1);
    }

    .form-group .input-wrapper i {
      position: absolute;
      left: 16px;
      color: rgba(255, 255, 255, 0.2);
      font-size: 1.1rem;
      transition: color 0.3s;
    }

    .form-group .input-wrapper:focus-within i {
      color: #f59e0b;
    }

    .form-group .input-wrapper input {
      width: 100%;
      padding: 14px 16px 14px 48px;
      background: transparent;
      border: none;
      color: #c8d6e5;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
    }

    .form-group .input-wrapper input::placeholder {
      color: rgba(255, 255, 255, 0.2);
    }

    /* Button */
    .btn-submit {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #f59e0b, #fbbf24);
      border: none;
      border-radius: 14px;
      color: #1a1a2e;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      box-shadow: 0 4px 30px rgba(245, 158, 11, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-submit:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 8px 50px rgba(245, 158, 11, 0.5);
    }

    .btn-submit:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-submit .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(26, 26, 46, 0.3);
      border-top-color: #1a1a2e;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .btn-submit.loading .spinner {
      display: block;
    }

    .btn-submit.loading .btn-text {
      display: none;
    }

    .btn-submit.loading .btn-icon {
      display: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Login link */
    .login-link {
      text-align: center;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 20px;
    }

    .login-link a {
      color: #a78bfa;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
    }

    .login-link a:hover {
      color: #7c4dff;
      text-decoration: underline;
    }

    /* ============================================
       RESPONSIVE
    ============================================ */
    @media (max-width: 480px) {
      .card {
        padding: 28px 20px;
        border-radius: 20px;
      }

      .header h1 {
        font-size: 1.5rem;
      }

      .header .icon {
        width: 50px;
        height: 50px;
        font-size: 22px;
      }

      .back-btn {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

  <!-- ============================================
       PARTICLES BACKGROUND
  ============================================ -->
  <div class="particles" id="particles"></div>

  <!-- ============================================
       CONTAINER
  ============================================ -->
  <div class="container">

    <div class="card">

      <!-- Back Button -->
      <a href="login.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> Kembali ke Login
      </a>

      <!-- Header -->
      <div class="header">
        <div class="icon">
          <i class="fas fa-key"></i>
        </div>
        <h1>Lupa <span>Password</span></h1>
        <p>Masukkan email Anda untuk mendapatkan link reset password</p>
      </div>

      <!-- ===== MESSAGE ===== -->
      <div class="message" id="message">
        <i class="fas" id="messageIcon"></i>
        <span id="messageText">Pesan</span>
      </div>

      <!-- ===== FORM ===== -->
      <form id="resetForm" novalidate>
        <div class="form-group">
          <label>Alamat Email</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope"></i>
            <input type="email" id="emailInput" placeholder="Masukkan email Anda" required />
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span class="btn-icon"><i class="fas fa-paper-plane"></i></span>
          <span class="btn-text">Kirim Link Reset</span>
          <span class="spinner"></span>
        </button>
      </form>

      <!-- Login Link -->
      <div class="login-link">
        <a href="login.html">Kembali ke halaman login</a>
      </div>

    </div>

  </div>

  <script>
    // ============================================================
    // 1. SUPABASE KONFIGURASI
    // ============================================================
    const SUPABASE_URL = 'https://ydcdfnvtacwrrhcbsjdk.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_DABKAaVwkW5LvR7oP-pDNQ_9SyGiBrI';

    // Inisialisasi Supabase Client
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ============================================================
    // 2. PARTICLES BACKGROUND
    // ============================================================
    (function createParticles() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 40; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.width = (2 + Math.random() * 4) + 'px';
        p.style.height = p.style.width;
        p.style.animationDuration = (15 + Math.random() * 25) + 's';
        p.style.animationDelay = (Math.random() * 20) + 's';
        p.style.opacity = 0.2 + Math.random() * 0.3;
        container.appendChild(p);
      }
    })();

    // ============================================================
    // 3. ELEMENT REFERENSI
    // ============================================================
    const resetForm = document.getElementById('resetForm');
    const submitBtn = document.getElementById('submitBtn');
    const emailInput = document.getElementById('emailInput');
    const message = document.getElementById('message');
    const messageText = document.getElementById('messageText');
    const messageIcon = document.getElementById('messageIcon');

    // ============================================================
    // 4. FUNGSI UTILITY
    // ============================================================
    function showMessage(text, type) {
      message.className = 'message show ' + type;
      messageText.textContent = text;
      messageIcon.className = 'fas ' + (type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle');
    }

    function hideMessage() {
      message.className = 'message';
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      submitBtn.classList.toggle('loading', isLoading);
      emailInput.disabled = isLoading;
    }

    // ============================================================
    // 5. RESET PASSWORD
    // ============================================================
    async function handleResetPassword(e) {
      e.preventDefault();
      hideMessage();

      const email = emailInput.value.trim();

      // Validasi email
      if (!email) {
        showMessage('Masukkan alamat email Anda.', 'error');
        return;
      }

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showMessage('Masukkan email yang valid.', 'error');
        return;
      }

      setLoading(true);

      try {
        console.log('📧 Mengirim reset password untuk:', email);

        // ===== RESET PASSWORD KE SUPABASE =====
        const { data, error } = await supabaseClient.auth.resetPasswordForEmail(email, {
          redirectTo: 'https://stevemc.my.id/reset-password.html'
        });

        // ===== HANDLE ERROR =====
        if (error) {
          console.error('❌ Reset password error:', error);

          if (error.message.includes('User not found') || error.message.includes('Email not found')) {
            showMessage('Email tidak ditemukan. Pastikan email sudah terdaftar.', 'error');
          } else {
            showMessage('Gagal mengirim link reset: ' + error.message, 'error');
          }
          setLoading(false);
          return;
        }

        // ===== BERHASIL =====
        console.log('✅ Reset password email terkirim');
        showMessage('Link reset password telah dikirim ke email Anda. Silakan cek inbox atau folder spam.', 'success');

        // Reset form
        emailInput.value = '';
        setLoading(false);

        // Auto redirect setelah 5 detik
        setTimeout(() => {
          window.location.href = 'https://stevemc.my.id/login.html';
        }, 5000);

      } catch (error) {
        console.error('❌ Unexpected error:', error);
        showMessage('Terjadi kesalahan. Silakan coba lagi.', 'error');
        setLoading(false);
      }
    }

    // ============================================================
    // 6. EVENT LISTENERS
    // ============================================================

    // Form submit
    resetForm.addEventListener('submit', handleResetPassword);

    // Enter key support
    resetForm.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleResetPassword(e);
      }
    });

    // ============================================================
    // 7. CEK SESSION - Jika sudah login, redirect ke beranda
    // ============================================================
    (async function checkSession() {
      try {
        const { data: { session }, error } = await supabaseClient.auth.getSession();

        if (error) {
          console.warn('Error checking session:', error);
          return;
        }

        if (session) {
          console.log('✅ User sudah login, redirect ke beranda');
          window.location.href = 'https://stevemc.my.id/';
        }

      } catch (err) {
        console.error('Error checking session:', err);
      }
    })();

    // ============================================================
    // 8. SUPABASE AUTH STATE CHANGE
    // ============================================================
    supabaseClient.auth.onAuthStateChange((event, session) => {
      console.log('🔐 Auth state changed:', event);

      if (event === 'SIGNED_IN' && session) {
        console.log('✅ User signed in, redirecting...');
        window.location.href = 'https://stevemc.my.id/';
      }

      if (event === 'PASSWORD_RECOVERY') {
        console.log('🔑 Password recovery mode');
        // Redirect ke halaman reset password baru
        window.location.href = 'https://stevemc.my.id/reset-password.html';
      }
    });

    console.log('%c🔑 Forgot Password Page Ready!', 'font-size:16px;font-weight:bold;color:#f59e0b;');
    console.log('📌 Supabase URL:', SUPABASE_URL);
    console.log('📌 Redirect URL: https://stevemc.my.id/reset-password.html');
  </script>

</body>
</html>
