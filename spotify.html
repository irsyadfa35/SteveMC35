<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Download Spotify MP3 + Preview</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ── Reset & Base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 820px;
            background: #181818;
            border-radius: 32px;
            padding: 40px 36px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 32px;
        }

        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.6);
            font-size: 20px;
            text-decoration: none;
            transition: all 0.3s ease;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            transform: translateX(-3px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .back-btn:active {
            transform: scale(0.92);
        }

        .header-icon {
            width: 52px;
            height: 52px;
            background: #1DB954;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #fff;
            box-shadow: 0 8px 24px rgba(29, 185, 84, 0.35);
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.3px;
            line-height: 1.2;
        }

        .header h1 span {
            color: #1DB954;
        }

        .header .sub {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 400;
            margin-top: 2px;
        }

        /* ── Input ── */
        .input-section {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .input-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .input-wrapper input {
            flex: 1;
            min-width: 180px;
            padding: 16px 20px;
            border-radius: 16px;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .input-wrapper input:focus {
            border-color: #1DB954;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(29, 185, 84, 0.15);
        }

        .input-wrapper input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-paste {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 16px;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.5);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .btn-paste:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .btn-paste:active {
            transform: scale(0.92);
        }

        .btn-paste:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-paste.pasted {
            color: #1DB954;
            border-color: #1DB954;
            background: rgba(29, 185, 84, 0.1);
        }

        .btn-convert {
            padding: 16px 32px;
            border-radius: 16px;
            border: none;
            background: #1DB954;
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
            font-family: inherit;
            box-shadow: 0 4px 20px rgba(29, 185, 84, 0.3);
            flex-shrink: 0;
        }

        .btn-convert:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(29, 185, 84, 0.45);
            background: #1ed760;
        }

        .btn-convert:active:not(:disabled) {
            transform: scale(0.97);
        }

        .btn-convert:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-convert .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .btn-convert.loading .spinner {
            display: block;
        }
        .btn-convert.loading .btn-text {
            display: none;
        }
        .btn-convert.loading .btn-icon {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── Error ── */
        .error-msg {
            display: none;
            margin-top: 12px;
            padding: 14px 18px;
            background: rgba(255, 0, 0, 0.12);
            border-left: 4px solid #ff0000;
            border-radius: 12px;
            color: #ff6b6b;
            font-size: 14px;
            align-items: center;
            gap: 10px;
        }

        .error-msg.show {
            display: flex;
        }

        .error-msg i {
            font-size: 18px;
        }

        /* ── Result ── */
        .result-section {
            display: none;
            margin-top: 32px;
            animation: fadeUp 0.5s ease forwards;
        }

        .result-section.show {
            display: block;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        .result-thumbnail {
            flex-shrink: 0;
            width: 160px;
            height: 160px;
            border-radius: 16px;
            overflow: hidden;
            background: #282828;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .result-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .result-info {
            flex: 1;
            min-width: 0;
        }

        .result-title {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }

        .result-artist {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 4px;
        }

        .result-album {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 8px;
        }

        .result-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 24px;
            margin-top: 8px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .result-meta .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
        }

        .result-meta .meta-item i {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.3);
        }

        .result-meta .meta-item strong {
            color: #fff;
            font-weight: 500;
        }

        /* ── Audio Player ── */
        .audio-player-wrapper {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            width: 100%;
        }

        .audio-player-wrapper audio {
            width: 100%;
            height: 48px;
            border-radius: 12px;
            background: #282828;
            outline: none;
        }

        .audio-player-wrapper audio::-webkit-media-controls-panel {
            background: #282828;
        }

        .audio-player-wrapper audio::-webkit-media-controls-current-time-display,
        .audio-player-wrapper audio::-webkit-media-controls-time-remaining-display {
            color: #fff;
        }

        /* ── Download Row ── */
        .download-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .btn-download {
            flex: 1;
            min-width: 140px;
            padding: 14px 24px;
            border-radius: 14px;
            border: none;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: inherit;
        }

        .btn-download.mp3 {
            background: #1DB954;
            color: #fff;
            box-shadow: 0 4px 20px rgba(29, 185, 84, 0.3);
        }

        .btn-download.mp3:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(29, 185, 84, 0.45);
            background: #1ed760;
        }

        .btn-download.mp3:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-download.secondary {
            background: rgba(255, 255, 255, 0.06);
            box-shadow: none;
            color: rgba(255, 255, 255, 0.7);
        }

        .btn-download.secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            box-shadow: none;
            color: #fff;
        }

        .btn-download:active:not(:disabled) {
            transform: scale(0.97);
        }

        .btn-download .spinner-small {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .btn-download.loading .spinner-small {
            display: block;
        }
        .btn-download.loading .btn-text {
            display: none;
        }
        .btn-download.loading .btn-icon {
            display: none;
        }

        /* ── Empty State ── */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            text-align: center;
            color: rgba(255, 255, 255, 0.25);
        }

        .empty-state i {
            font-size: 56px;
            margin-bottom: 16px;
            color: rgba(255, 255, 255, 0.08);
        }

        .empty-state p {
            font-size: 15px;
            max-width: 320px;
            line-height: 1.6;
        }

        /* ── Responsive ── */
        @media (max-width: 640px) {
            .container {
                padding: 24px 18px;
                border-radius: 24px;
            }
            .header {
                flex-wrap: wrap;
                gap: 10px;
            }
            .back-btn {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
            .header-icon {
                width: 44px;
                height: 44px;
                font-size: 20px;
            }
            .header h1 {
                font-size: 20px;
            }
            .input-wrapper input {
                padding: 14px 16px;
                font-size: 14px;
                min-width: 140px;
            }
            .btn-paste {
                width: 48px;
                height: 48px;
                font-size: 18px;
            }
            .btn-convert {
                padding: 14px 22px;
                font-size: 14px;
                width: 100%;
                justify-content: center;
            }
            .result-card {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .result-thumbnail {
                width: 140px;
                height: 140px;
            }
            .result-title {
                font-size: 18px;
            }
            .result-meta {
                justify-content: center;
            }
            .download-row {
                flex-direction: column;
            }
            .btn-download {
                width: 100%;
            }
            .audio-player-wrapper audio {
                height: 42px;
            }
        }

        @media (max-width: 420px) {
            .container {
                padding: 16px 12px;
            }
            .header h1 {
                font-size: 17px;
            }
            .header .sub {
                font-size: 12px;
            }
            .back-btn {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
            .btn-paste {
                width: 42px;
                height: 42px;
                font-size: 16px;
            }
            .result-thumbnail {
                width: 120px;
                height: 120px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ─── HEADER ─── -->
        <div class="header">
            <a href="index.html" class="back-btn" title="Kembali ke beranda">
                <i class="fas fa-arrow-left"></i>
            </a>
            <div class="header-icon">
                <i class="fab fa-spotify"></i>
            </div>
            <div>
                <h1>Download <span>Spotify</span> MP3</h1>
                <div class="sub">Cari lagu, preview, unduh audio</div>
            </div>
        </div>

        <!-- ─── INPUT ─── -->
        <div class="input-section">
            <div class="input-wrapper">
                <input
                type="text"
                id="searchInput"
                placeholder="Cari judul lagu atau artis... (contoh: Always Forever)"
                autocomplete="off"
                spellcheck="false"
                />
                <button class="btn-paste" id="pasteBtn" title="Tempel dari clipboard">
                    <i class="fas fa-paste"></i>
                </button>
                <button class="btn-convert" id="searchBtn">
                    <span class="btn-icon"><i class="fas fa-search"></i></span>
                    <span class="btn-text">Cari & Download</span>
                    <span class="spinner"></span>
                </button>
            </div>

            <div class="error-msg" id="errorMsg">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText">Terjadi kesalahan, silakan coba lagi.</span>
            </div>
        </div>

        <!-- ─── RESULT ─── -->
        <div class="result-section" id="resultSection">
            <div class="result-card">
                <div class="result-thumbnail" id="thumbnailContainer">
                    <img id="thumbnailImg" src="" alt="Cover" />
                </div>
                <div class="result-info">
                    <div class="result-title" id="resultTitle">—</div>
                    <div class="result-artist" id="resultArtist">—</div>
                    <div class="result-album" id="resultAlbum">—</div>
                    <div class="result-meta">
                        <span class="meta-item"><i class="fas fa-clock"></i> <strong id="metaDuration">—</strong></span>
                        <span class="meta-item"><i class="fas fa-calendar-alt"></i> <strong id="metaRelease">—</strong></span>
                        <span class="meta-item"><i class="fas fa-chart-line"></i> <strong id="metaPopularity">—</strong></span>
                    </div>

                    <!-- Audio Player Preview -->
                    <div class="audio-player-wrapper">
                        <audio id="audioPlayer" controls preload="metadata">
                            <source id="audioSource" src="" type="audio/mpeg" />
                            Browser Anda tidak mendukung pemutar audio.
                        </audio>
                    </div>

                    <div class="download-row">
                        <button class="btn-download mp3" id="downloadBtn">
                            <span class="btn-icon"><i class="fas fa-download"></i></span>
                            <span class="btn-text">Download MP3</span>
                            <span class="spinner-small"></span>
                        </button>
                        <button class="btn-download secondary" id="copyLinkBtn">
                            <i class="fas fa-copy"></i> Salin Link Spotify
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ─── EMPTY STATE ─── -->
        <div class="empty-state" id="emptyState">
            <i class="fas fa-music"></i>
            <p>Masukkan judul lagu atau nama artis di atas, lalu klik <strong>Cari & Download</strong> untuk mendapatkan MP3.</p>
        </div>

    </div>

    <script>
        // ─── DOM refs ──────────────────────────────────────────────
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const pasteBtn = document.getElementById('pasteBtn');
        const errorMsg = document.getElementById('errorMsg');
        const errorText = document.getElementById('errorText');
        const resultSection = document.getElementById('resultSection');
        const emptyState = document.getElementById('emptyState');

        const thumbnailImg = document.getElementById('thumbnailImg');
        const resultTitle = document.getElementById('resultTitle');
        const resultArtist = document.getElementById('resultArtist');
        const resultAlbum = document.getElementById('resultAlbum');
        const metaDuration = document.getElementById('metaDuration');
        const metaRelease = document.getElementById('metaRelease');
        const metaPopularity = document.getElementById('metaPopularity');
        const downloadBtn = document.getElementById('downloadBtn');
        const copyLinkBtn = document.getElementById('copyLinkBtn');
        const audioPlayer = document.getElementById('audioPlayer');
        const audioSource = document.getElementById('audioSource');

        // ─── State ──────────────────────────────────────────────────
        let currentDownloadUrl = '';
        let currentTitle = '';
        let currentArtist = '';
        let currentSpotifyUrl = '';

        // ─── Helpers ────────────────────────────────────────────────
        function showError(msg) {
            errorText.textContent = msg || 'Terjadi kesalahan.';
            errorMsg.classList.add('show');
        }

        function hideError() {
            errorMsg.classList.remove('show');
        }

        function setLoading(isLoading) {
            searchBtn.disabled = isLoading;
            searchInput.disabled = isLoading;
            pasteBtn.disabled = isLoading;
            if (isLoading) {
                searchBtn.classList.add('loading');
            } else {
                searchBtn.classList.remove('loading');
            }
        }

        function setDownloadLoading(isLoading) {
            if (isLoading) {
                downloadBtn.classList.add('loading');
                downloadBtn.disabled = true;
            } else {
                downloadBtn.classList.remove('loading');
                downloadBtn.disabled = false;
            }
        }

        // ─── API call ──────────────────────────────────────────────
        async function fetchSpotify(query) {
            const encoded = encodeURIComponent(query.trim());
            const apiUrl = `https://api.nexray.eu.cc/downloader/spotifyplay?q=${encoded}`;
            const resp = await fetch(apiUrl);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            if (!data.status) throw new Error(data.message || 'API mengembalikan status false.');
            if (!data.result || !data.result.download_url) {
                throw new Error('Tidak ada hasil untuk pencarian ini.');
            }
            return data;
        }

        function renderResult(data) {
            const r = data.result;
            currentDownloadUrl = r.download_url || '';
            currentTitle = r.title || 'Unknown Title';
            currentArtist = r.artist || 'Unknown Artist';
            currentSpotifyUrl = r.url || '';

            // Thumbnail
            if (r.thumbnail) {
                thumbnailImg.src = r.thumbnail;
                thumbnailImg.alt = r.title || 'Cover';
            } else {
                thumbnailImg.src = '';
                thumbnailImg.alt = 'No cover';
            }

            resultTitle.textContent = r.title || '—';
            resultArtist.textContent = r.artist || '—';
            resultAlbum.textContent = r.album ? `Album: ${r.album}` : '—';
            metaDuration.textContent = r.duration || '—';
            metaRelease.textContent = r.release_at || '—';
            metaPopularity.textContent = r.popularity ? `${r.popularity}%` : '—';

            // Set audio player
            if (currentDownloadUrl) {
                audioSource.src = currentDownloadUrl;
                audioPlayer.load();
                audioPlayer.style.display = 'block';
                downloadBtn.disabled = false;
            } else {
                audioPlayer.style.display = 'none';
                downloadBtn.disabled = true;
            }

            resultSection.classList.add('show');
            emptyState.style.display = 'none';
        }

        // ─── Download handler ──────────────────────────────────────
        async function downloadFile(url, filename, buttonElement) {
            if (!url) {
                showError('Tidak ada URL untuk diunduh.');
                return;
            }
            try {
                setDownloadLoading(true);
                const resp = await fetch(url);
                if (!resp.ok) throw new Error('Gagal mengunduh file');
                const blob = await resp.blob();
                const finalName = filename.endsWith('.mp3') ? filename : `${filename}.mp3`;

                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = finalName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(link.href), 5000);

            } catch (err) {
                // fallback: buka langsung
                try {
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = filename.endsWith('.mp3') ? filename : `${filename}.mp3`;
                    link.target = '_blank';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                } catch (_) {
                    showError('Gagal mengunduh. Coba klik kanan dan "Save link as..."');
                }
            } finally {
                setDownloadLoading(false);
            }
        }

        // ─── Paste ──────────────────────────────────────────────────
        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    searchInput.value = text;
                    searchInput.focus();
                    pasteBtn.classList.add('pasted');
                    setTimeout(() => pasteBtn.classList.remove('pasted'), 1500);
                } else {
                    showError('Clipboard kosong.');
                }
            } catch (_) {
                const text = prompt('Tidak dapat mengakses clipboard. Silakan tempel teks secara manual:', '');
                if (text !== null && text.trim() !== '') {
                    searchInput.value = text.trim();
                    searchInput.focus();
                }
            }
        }

        // ─── Search ─────────────────────────────────────────────────
        async function handleSearch() {
            const raw = searchInput.value.trim();
            if (!raw) {
                showError('Silakan masukkan judul lagu atau nama artis.');
                return;
            }

            hideError();
            setLoading(true);
            resultSection.classList.remove('show');
            emptyState.style.display = 'flex';
            // Reset audio
            audioPlayer.pause();
            audioSource.src = '';
            audioPlayer.load();

            try {
                const data = await fetchSpotify(raw);
                renderResult(data);
                hideError();
            } catch (err) {
                console.error(err);
                showError(err.message || 'Gagal mencari lagu. Periksa kata kunci dan coba lagi.');
                resultSection.classList.remove('show');
                emptyState.style.display = 'flex';
            } finally {
                setLoading(false);
            }
        }

        // ─── Event listeners ────────────────────────────────────────
        searchBtn.addEventListener('click', handleSearch);

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleSearch();
            }
        });

        pasteBtn.addEventListener('click', pasteFromClipboard);

        downloadBtn.addEventListener('click', () => {
            if (!currentDownloadUrl) {
                showError('Tidak ada audio untuk diunduh.');
                return;
            }
            const name = `${currentArtist} - ${currentTitle}`.replace(/[^a-zA-Z0-9 ]/g, '').trim() || 'spotify_audio';
            downloadFile(currentDownloadUrl, name, downloadBtn);
        });

        copyLinkBtn.addEventListener('click', () => {
            if (!currentSpotifyUrl) {
                showError('Tidak ada link Spotify untuk disalin.');
                return;
            }
            navigator.clipboard.writeText(currentSpotifyUrl)
                .then(() => {
                    const orig = copyLinkBtn.innerHTML;
                    copyLinkBtn.innerHTML = '<i class="fas fa-check"></i> Tersalin!';
                    setTimeout(() => { copyLinkBtn.innerHTML = orig; }, 2000);
                })
                .catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = currentSpotifyUrl;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    const orig = copyLinkBtn.innerHTML;
                    copyLinkBtn.innerHTML = '<i class="fas fa-check"></i> Tersalin!';
                    setTimeout(() => { copyLinkBtn.innerHTML = orig; }, 2000);
                });
        });

        // ─── Init ────────────────────────────────────────────────────
        emptyState.style.display = 'flex';
        resultSection.classList.remove('show');
        hideError();
        downloadBtn.disabled = true;
        audioPlayer.style.display = 'none';
    </script>

</body>
</html>
